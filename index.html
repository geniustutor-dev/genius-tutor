    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

            query, orderBy, limit, where, serverTimestamp, getCountFromServer, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXuXXjUxjpRJuEJLVQqTYt33tku3Nb4rQ",
            authDomain: "genius-tutor-4a7b2.firebaseapp.com",
            projectId: "genius-tutor-4a7b2",
            storageBucket: "genius-tutor-4a7b2.firebasestorage.app",
            messagingSenderId: "550046537454",
            appId: "1:550046537454:web:3446c9513e46f752ff05ff"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);

        // The Play Store version opens this site from the Android app and Chrome reports that as the page referrer.
        // Google Play does not allow other payment methods inside the app, so payment details are hidden there.
        // The website itself (opened in a browser or installed from Chrome) keeps showing them.

        const PLAY_APP_PACKAGES = ['app.vercel.genius_tutor_na1q.twa', 'com.geniuscbt.app'];
        const IS_PLAY_APP = (() => {
            try {
                if (document.referrer && PLAY_APP_PACKAGES.some(p => document.referrer.indexOf('android-app://' + p) === 0)) sessionStorage.setItem('gt_play', '1');
                return sessionStorage.getItem('gt_play') === '1';
            } catch (_) { return false; }
        })();

        // --- QUESTION BANK (placeholder: replace with real questions) ---
        function generateSubjectBank(prefix, count) {
            const bank = [];
            for (let i = 1; i <= count; i++) {
                bank.push({
                    id: i,
                    question: `[${prefix.toUpperCase()}] Standard JAMB Practice Item #${i}: Which of the following principles or rules correctly applies to this scenario?`,
                    options: [
                        `Option A for question ${i} representing foundational concept`,
                        `Option B for question ${i} representing alternative theory`,
                        `Option C for question ${i} representing correct standard solution`,
                        `Option D for question ${i} representing distractor variable`
                    ],
                    answer: 2,
                    explanation: `Explanation for question ${i}.`
                });
            }
            return bank;
        }
        // --- SUBJECT LIST (id, label). Ids of existing subjects are kept so saved data still works. ---
        const SUBJECT_DEFS = [
            ['mathematics', 'General Mathematics'],
            ['citizenship', 'Citizenship and Heritage Studies'],
            ['digital', 'Digital Technologies'],
            ['biology', 'Biology'],
            ['chemistry', 'Chemistry'],
            ['physics', 'Physics'],
            ['agriculture', 'Agriculture'],
            ['furthermaths', 'Further Mathematics'],
            ['government', 'Government'],
            ['irs', 'Islamic Religious Studies'],
            ['literature', 'Literature in English'],
            ['accounting', 'Financial Accounting'],
            ['commerce', 'Commerce'],
            ['marketing', 'Marketing'],
            ['economics', 'Economics'],
            ['livestock', 'Livestock Farming']
        ];
        const SUBJECT_LABELS = Object.fromEntries([['english', 'English Language'], ...SUBJECT_DEFS]);
        const questionBank = { english: generateSubjectBank("English Language", 125) };
        SUBJECT_DEFS.forEach(([id, label]) => { questionBank[id] = generateSubjectBank(label, 125); });

        // Real question banks loaded from separate files.
        // Rows look like: [question, CORRECT answer, wrong1, wrong2, wrong3]
        const REAL_BANKS = {
            biology: window.BIOLOGY,
            chemistry: window.CHEMISTRY,
            physics: window.PHYSICS,
            mathematics: window.MATHEMATICS,
            citizenship: window.CITIZENSHIP,
            digital: window.DIGITAL,
            accounting: window.FINANCIAL_ACCOUNTING
        };

        // WAEC/NECO/GCE question banks (kept apart from the JAMB banks above). Same row format.
        // To add another subject, load its file in the <head> and add a line here.
        const WAEC_BANKS = {
            chemistry: window.CHEMISTRY_WAEC,
            economics: window.ECONOMICS_WAEC,
            accounting: window.FINANCIAL_ACCOUNTING
        };

        // --- ENGLISH EXAM BUILDER (uses questions.js) ---
        function shuffleArr(a) {
            a = [...a];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        // A short fingerprint of a question, used to remember which ones a student has already practised.
        function keyOf(row) {
            let h = 5381; const t = row[0] + '|' + row[1];
            for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
            return (h >>> 0).toString(36);
        }
        // Rows are [question, CORRECT, wrong1, wrong2, wrong3, topic (optional)]
        function toItem(row, passage, extra) {
            const [question, correct, w1, w2, w3, topic] = row;
            const opts = shuffleArr([correct, w1, w2, w3].filter(x => x !== undefined));
            return { question, options: opts, answer: opts.indexOf(correct), passage: passage || null, topic: topic || '', key: keyOf(row), ...(extra || {}) };
        }
        function englishExamSize(noNovel) {
            const E = window.ENGLISH;
            if (!E) return 60;
            const pq = Math.min(2, Object.keys(E.passages || {}).length) * 5;
            const available = pq + (noNovel ? 0 : Math.min(5, (E.novel || []).length)) + (E.general || []).length;
            return Math.min(60, available);
        }
        function buildEnglishExam(noNovel) {   // noNovel = true for WAEC/NECO/GCE: the JAMB novel is JAMB-only
            const E = window.ENGLISH;
            if (!E) return getRandomQuestions('english', 60);
            const out = [];
            shuffleArr(Object.keys(E.passages || {})).slice(0, 2).forEach(k => {
                E.passages[k].qs.forEach(r => out.push(toItem(r, E.passages[k].text)));
            });
            const novel = (noNovel ? [] : shuffleArr(E.novel || []).slice(0, 5)).map(r => toItem(r, null, { novel: true }));
            const need = 60 - out.length - novel.length;
            const general = shuffleArr(E.general || []).slice(0, Math.max(0, need)).map(r => toItem(r));
            return [...out, ...general, ...novel];
        }

        // --- STATE ---
        let state = {
            currentView: 'loading',
            user: null,          // profile from Firestore
            isAdmin: false,
            examData: {},
            activeSubject: 'english',
            currentIndex: 0,
            answers: {},
            flagged: {},
            timeLeft: 7200,
            timerInterval: null,
            sessionId: null,
            deadline: 0,
            serverOffset: 0,
            saveError: false,
            history: null,
            practiceHistory: [],
            psetup: { subjects: [], count: 10 },
            esetup: { subjects: [] },
            examSubjects: [],
            pickMsg: '',
            leaderboard: null,
            pass: null,
            adminFilter: '',
            practice: null,
            wsetup: { subject: 'english' },
            wpsetup: { subject: 'english', count: 10 },
            waec: null,
            waecHistory: [],
            review: null,
            adminData: { users: [], sessions: [] },
            notice: ''
        };
        let registering = false;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function getRandomQuestions(key, count) {
            const rows = REAL_BANKS[key];
            if (rows && rows.length) {
                return shuffleArr(rows).slice(0, count).map(r => toItem(r));
            }
            const all = [...questionBank[key]];
            for (let i = all.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [all[i], all[j]] = [all[j], all[i]];
            }
            return all.slice(0, count);
        }

        // WAEC/NECO/GCE papers use the WAEC bank when a subject has one. If it holds fewer questions than needed,
        // the general bank tops it up. Subjects without a WAEC bank keep using the general bank.
        function waecPool(key, need) {
            const own = (WAEC_BANKS[key] || []).filter(Boolean);
            if (!own.length) return [];
            if (own.length >= need) return own;
            const have = new Set(own.map(r => keyOf(r)));
            return own.concat((REAL_BANKS[key] || []).filter(r => !have.has(keyOf(r))));
        }
        function getWaecQuestions(key, count) {
            const pool = waecPool(key, count);
            if (pool.length) return shuffleArr(pool).slice(0, count).map(r => toItem(r));
            return getRandomQuestions(key, count);
        }

        // --- MATHS DISPLAY: stacked fractions, matrices in rows and columns, roots, powers and diagrams ---
        // Used only for General Mathematics. Write questions in plain text:
        //   fractions: 3/4, 2 1/2, (x + 1)/(x − 2)     matrices: [1 2; 3 4]  (rows split by ;)
        //   powers: 8^(2/3)     roots: √3, √(A/π)      diagrams: {{fig:rtri|8 cm|6 cm|x}}
        const MFG = '#0b5a3c', MTX = '#0b3d2b', MFL = '#e7f3ec';
        function mathToHtml(raw) {
            const store = [];
            const hold = h => '\uE000' + (store.push(h) - 1) + '\uE001';
            const unhold = s => { let p; do { p = s; s = s.replace(/\uE000(\d+)\uE001/g, (_, i) => store[+i]); } while (s !== p); return s; };
            const CH = '[\\wπθ√²³⁴⁵⁶⁷⁸⁹⁰¹⁻⁺ˣ₀₁₂₃₄₅₆₇₈₉\\uE000\\uE001]+';
            const TERM = CH + '(?:\\.' + CH + ')*';   // a decimal point only counts when digits follow it, so "3/4." keeps its full stop outside
            const FRAC = new RegExp('(\\([^()]*\\)|' + TERM + ')/(\\([^()]*\\)|' + TERM + ')', 'g');
            const strip = t => t.charAt(0) === '(' ? t.slice(1, -1) : t;
            const frac = (n, d) => '<span class="mfrac"><span class="mfn">' + n + '</span><span class="mfd">' + d + '</span></span>';
            const rad = inner => '<span class="mrad">√<span class="mrb">' + inner + '</span></span>';
            function matrix(body) {
                const rows = body.split(';').map(r => r.trim()).filter(Boolean).map(r => r.indexOf(',') >= 0 ? r.split(/\s*,\s*/) : r.split(/\s+/));
                const cols = Math.max(...rows.map(r => r.length));
                return '<span class="mmat" style="grid-template-columns:repeat(' + cols + ',auto)">' +
                    rows.map(r => { while (r.length < cols) r.push(''); return r.map(e => '<span>' + conv(e) + '</span>').join(''); }).join('') + '</span>';
            }
            function conv(s) {
                s = s.replace(/\b(km|m|cm|mm|kg|g|ml|l)\/(h|s|min|hr|l)\b/g, m => hold(m));   // units such as km/h stay as written
                s = s.replace(/\[([^\[\]&\uE000\uE001]*;[^\[\]&\uE000\uE001]*)\]/g, (_, b) => hold(matrix(b)));
                s = s.replace(/√\(([^()]*)\)/g, (_, a) => hold(rad(conv(a))));
                s = s.replace(/\^\(([^()]*)\)/g, (_, a) => hold('<sup class="msup">' + conv(a) + '</sup>'));
                s = s.replace(/\^([−-]?\w+(?:\.\w+)?)/g, (_, a) => hold('<sup class="msup">' + a + '</sup>'));
                s = s.replace(/(^|[^\w.\/])(\d+) (\d+)\/(\d+)(?![\w\/])/g, (_, p, w, n, d) => p + w + hold(frac(n, d)));
                s = s.replace(FRAC, (_, n, d) => hold(frac(conv(strip(n)), conv(strip(d)))));
                s = s.replace(/√(\w+(?:\.\w+)?[²³]*)/g, (_, a) => hold(rad(a)));
                return s;
            }
            return unhold(conv(esc(raw)));
        }

        const mt = (x, y, t, o = {}) => t ? '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || 'middle') + '" font-size="' + (o.s || 13) + '" fill="' + (o.c || MTX) + '"' + (o.i ? ' font-style="italic"' : '') + (o.h ? ' stroke="#fff" stroke-width="3" paint-order="stroke"' : '') + '>' + esc(t) + '</text>' : '';
        const msvg = (w, h, inner, x0 = 0) => '<svg viewBox="' + x0 + ' 0 ' + w + ' ' + h + '" width="' + Math.round(w * 1.25) + '" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="diagram for the question" font-family="Inter, sans-serif">' + inner + '</svg>';
        const mln = (x1, y1, x2, y2, w = 2, extra = '') => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' + (extra.indexOf('stroke=') >= 0 ? '' : 'stroke="' + MFG + '" ') + 'stroke-width="' + w + '" stroke-linecap="round" ' + extra + '/>';
        const mpoly = (pts, fill = MFL) => '<polygon points="' + pts.map(p => p.join(',')).join(' ') + '" fill="' + fill + '" stroke="' + MFG + '" stroke-width="2" stroke-linejoin="round"/>';
        const mdot = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="3.2" fill="' + MFG + '"/>';
        const mrt = d => '<path d="' + d + '" fill="none" stroke="' + MFG + '" stroke-width="1.5"/>';
        const num = v => parseFloat(String(v).replace('−', '-'));

        const MFIG = {
            // right-angled triangle: base | height | hypotenuse | angle at left corner | angle at top
            rtri: a => msvg(260, 185, mpoly([[30, 150], [200, 150], [200, 40]]) + mrt('M190 150 L190 140 L200 140') +
                mt(115, 172, a[0]) + mt(212, 100, a[1], { a: 'start' }) + mt(104, 84, a[2], { a: 'end' }) + mt(74, 144, a[3]) + mt(186, 74, a[4], { a: 'end' })),
            // general triangle ABC: side BC | side CA | side AB | angle A | angle B | angle C
            tri: a => msvg(270, 185, mpoly([[130, 28], [30, 150], [240, 150]]) +
                mt(130, 17, 'A') + mt(18, 162, 'B') + mt(254, 162, 'C') +
                mt(135, 174, a[0]) + mt(202, 84, a[1], { a: 'start' }) + mt(62, 84, a[2], { a: 'end' }) +
                mt(130, 62, a[3]) + mt(68, 143, a[4]) + mt(202, 143, a[5])),
            // rectangle: length | width
            rect: a => msvg(260, 170, '<rect x="40" y="30" width="170" height="100" fill="' + MFL + '" stroke="' + MFG + '" stroke-width="2"/>' + mt(125, 152, a[0]) + mt(222, 86, a[1], { a: 'start' })),
            // trapezium: top | bottom | height
            trap: a => msvg(260, 175, mpoly([[75, 35], [175, 35], [225, 135], [30, 135]]) + mln(75, 35, 75, 135, 1.5, 'stroke-dasharray="5 4"') + mrt('M85 135 L85 125 L75 125') +
                mt(125, 26, a[0]) + mt(127, 156, a[1]) + mt(82, 92, a[2], { a: 'start' })),
            // circle: r or d | label
            circle: a => msvg(230, 185, '<circle cx="115" cy="92" r="72" fill="' + MFL + '" stroke="' + MFG + '" stroke-width="2"/>' +
                (a[0] === 'd' ? mln(43, 92, 187, 92) + mt(115, 83, a[1]) : mln(115, 92, 187, 92) + mt(151, 83, a[1])) + mdot(115, 92) + mt(104, 108, 'O')),
            // angle at the centre and at the circumference on the same chord: centre label | circumference label
            circang: a => msvg(230, 190, '<circle cx="110" cy="100" r="75" fill="' + MFL + '" stroke="' + MFG + '" stroke-width="2"/>' +
                mln(110, 100, 48.6, 143) + mln(110, 100, 171.4, 143) + mln(110, 25, 48.6, 143) + mln(110, 25, 171.4, 143) +
                mdot(110, 100) + mt(101, 97, 'O') + mt(36, 153, 'A') + mt(184, 153, 'B') + mt(110, 16, 'P') + mt(110, 128, a[0]) + mt(110, 62, a[1])),
            // sector: angle | radius
            sector: a => {
                const th = Math.max(20, Math.min(180, num(a[0]) || 90)), r = 95, cx = 50, cy = 125, rd = th * Math.PI / 180;
                const x2 = cx + r * Math.cos(rd), y2 = cy - r * Math.sin(rd);
                return msvg(190, 150, '<path d="M' + cx + ' ' + cy + ' L' + (cx + r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 0 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' Z" fill="' + MFL + '" stroke="' + MFG + '" stroke-width="2" stroke-linejoin="round"/>' +
                    mdot(cx, cy) + mt(cx + 44 * Math.cos(rd / 2), cy - 44 * Math.sin(rd / 2) + 4, a[0]) + mt(cx + r / 2, cy + 17, a[1]));
            },
            // two parallel lines cut by a transversal. Labels as  value@slot  where slot = a1..a4 (top line) or b1..b4 (bottom line)
            // slots go round the crossing: 1 above-left, 2 above-right, 3 below-right, 4 below-left (2 and 4 are acute, 1 and 3 are obtuse)
            parallel: a => {
                const C = { a: [140, 55], b: [102.5, 120] }, S = { 1: [120, 28], 2: [30, 34], 3: [300, 28], 4: [210, 34] };
                let lab = '';
                a.forEach(s => {
                    const m = s.match(/^(.*)@([ab])([1-4])$/); if (!m) return;
                    const c = C[m[2]], p = S[m[3]], t = p[0] * Math.PI / 180;
                    lab += mt((c[0] + p[1] * Math.cos(t)).toFixed(1), (c[1] - p[1] * Math.sin(t) + 4).toFixed(1), m[1]);
                });
                return msvg(270, 175, mln(15, 55, 255, 55) + mln(15, 120, 255, 120) + mln(82.5, 154.6, 160, 20.4) +
                    '<path d="M26 49 L32 55 L26 61 M26 114 L32 120 L26 126" fill="none" stroke="' + MFG + '" stroke-width="1.8"/>' + lab);
            },
            // bar chart: labels | values | title
            bar: a => {

        async function nameKey(name) {

        const PRACTICE_SECS_PER_Q = 40;   // same pace as the real exam: 180 questions in 120 minutes
        let practiceInterval = null;

        // true when the subject has real questions in the JAMB bank or in a WAEC bank (used by the WAEC screens)
        function hasWaecQuestions(sub) {
            return hasRealQuestions(sub) || !!(WAEC_BANKS[sub] && WAEC_BANKS[sub].filter(Boolean).length);
        }
        function hasRealQuestions(sub) {
            if (sub === 'english') return !!window.ENGLISH;
            return !!(REAL_BANKS[sub] && REAL_BANKS[sub].length);
        }

        function defaultPicks() {
            const reg = ((state.user && state.user.subjects) || []).filter(s => OTHER_SUBJECTS.includes(s));
            const out = [...new Set(reg)].slice(0, 3);
            for (const s of [...OTHER_SUBJECTS].sort((a, b) => hasRealQuestions(b) - hasRealQuestions(a))) { if (out.length >= 3) break; if (!out.includes(s)) out.push(s); }
            return out;

        // --- SETTINGS ---
        const PLAY_STORE_URL = '';   // paste the Google Play link here after the app is published; "Rate Us" will then open it

        function openSettings() { setView('settings'); window.scrollTo(0, 0); }
        // when the app is reopened by the Back button from privacy / terms / about, show Settings again
        function wantsSettings() {
            try { const st = history.state; if (st && st.gt && st.v === 'settings') return true; } catch (_) {}
            if (location.hash === '#settings') {
                try {
                    history.replaceState({ gt: 1, v: 'home' }, '', location.pathname);
                    history.pushState({ gt: 1, v: 'settings' }, '', location.pathname);
                } catch (_) {}
                return true;
            }
            return false;
        }
        function closeSettings() { if (state.user) showDashboard(); else setView('home'); window.scrollTo(0, 0); }
        async function shareApp() {
            const url = PLAY_STORE_URL || (location.origin + '/');
            const text = 'Practise JAMB, WAEC, NECO and GCE questions in a real CBT setting with Genius CBT.';
            try {
                if (navigator.share) { await navigator.share({ title: 'Genius CBT', text, url }); return; }
            } catch (e) { if (e && e.name === 'AbortError') return; }
            try { await navigator.clipboard.writeText(text + ' ' + url); alert('Link copied. You can now paste it to share.'); }
            catch (_) { prompt('Copy this link to share:', url); }
        }
        function rateApp() {
            if (PLAY_STORE_URL) { window.open(PLAY_STORE_URL, '_blank'); return; }
            location.href = 'mailto:' + SUPPORT_EMAIL + '?subject=' + encodeURIComponent('Genius CBT feedback');
        }
        function renderSettings() {

                const tag = attrs.href ? 'a' : 'button';
                const target = attrs.href ? `href="${attrs.href}"` : `onclick="${attrs.click}"`;
                return `<${tag} ${target} class="${rowCls} ${extra}"><span class="text-lg w-6 text-center">${ico}</span><span class="flex-1">${label}</span><span class="text-[#58796b]">›</span></${tag}>`;
            };
            return `

                    <div class="max-w-xl mx-auto p-4 sm:p-6">
                        <div class="flex items-center gap-3 mb-5">

        // --- SHOW / HIDE PASSWORD ---
        function togglePw(id, btn) {
            const el = document.getElementById(id);
            if (!el) return;
            const show = el.type === 'password';
            el.type = show ? 'text' : 'password';
            btn.textContent = show ? 'Hide' : 'Show';

        // --- DELETE ACCOUNT ---
        function openDeleteAccount() {
            if (!state.user || !auth.currentUser) return;
            if (state.isAdmin) { alert('Admin accounts cannot be deleted from the app.'); return; }
            closeDeleteAccount();
            const ov = document.createElement('div');
            ov.id = 'gt-delete-overlay';
            ov.className = 'fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-4';
            ov.innerHTML = `
                <div class="bg-white text-[#0b3d2b] rounded-2xl p-5 w-full max-w-sm shadow-xl">
                    <h3 class="font-display font-bold text-lg text-red-700">Delete your account?</h3>
                    <p class="text-sm mt-2 leading-relaxed">This permanently deletes your account, your exam and practice history, your answer reviews, your leaderboard entry and your messages. Any paid plan on this account will also be lost. <strong>This cannot be undone.</strong></p>
                    <label class="block text-xs font-semibold mt-4 mb-1" for="gt-delete-pw">Enter your password to confirm</label>
                    <div class="relative"><input id="gt-delete-pw" type="password" autocomplete="current-password" class="w-full border border-[#d9d4c3] rounded-lg px-3 py-2.5 pr-16 text-sm text-[#0b3d2b]" placeholder="Password"><button type="button" onclick="togglePw('gt-delete-pw', this)" tabindex="-1" aria-label="Show or hide password" class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-[#0b5a3c]">Show</button></div>
                    <p id="gt-delete-err" class="text-xs text-red-700 mt-2 min-h-[1rem]"></p>
                    <div class="flex gap-2 mt-3">
                        <button id="gt-delete-cancel" onclick="closeDeleteAccount()" class="flex-1 border border-[#d9d4c3] rounded-xl px-4 py-2.5 text-sm font-semibold">Cancel</button>
                        <button id="gt-delete-go" onclick="confirmDeleteAccount()" class="flex-1 bg-red-700 hover:bg-red-800 text-white rounded-xl px-4 py-2.5 text-sm font-semibold">Delete forever</button>
                    </div>
                </div>`;
            document.body.appendChild(ov);
            setTimeout(() => { const i = document.getElementById('gt-delete-pw'); if (i) i.focus(); }, 50);
        }
        function closeDeleteAccount() {
            const ov = document.getElementById('gt-delete-overlay');
            if (ov) ov.remove();
        }
        async function confirmDeleteAccount() {
            const user = auth.currentUser;
            const pwEl = document.getElementById('gt-delete-pw');
            const errEl = document.getElementById('gt-delete-err');
            const goBtn = document.getElementById('gt-delete-go');
            const cancelBtn = document.getElementById('gt-delete-cancel');
            if (!user || !state.user || !pwEl) return;
            const password = pwEl.value;
            if (!password) { errEl.textContent = 'Please enter your password.'; return; }
            goBtn.disabled = true; cancelBtn.disabled = true; goBtn.textContent = 'Deleting…'; errEl.textContent = '';
            const uid = user.uid;
            const name = state.user.name;
            try {
                // 1. confirm it is really the owner (this also gives Firebase the fresh login it needs to delete an account)
                await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, password));
            } catch (err) {
                goBtn.disabled = false; cancelBtn.disabled = false; goBtn.textContent = 'Delete forever';
                errEl.textContent = (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password')
                    ? 'Incorrect password.' : friendlyError(err);
                return;
            }
            try {
                // 2. delete the student's data (each step is independent, so one failure does not stop the rest)
                const attempt = async fn => { try { await fn(); } catch (e) { console.error('Delete step failed', e); } };
                stopMessaging();
                await attempt(async () => {
                    const snap = await getDocs(query(collection(db, 'sessions'), where('uid', '==', uid)));
                    for (const d of snap.docs) {
                        await attempt(() => deleteDoc(doc(db, 'reviews', d.id)));
                        await attempt(() => deleteDoc(d.ref));
                    }
                });
                await attempt(async () => {
                    const snap = await getDocs(query(collection(db, 'threads'), where('uid', '==', uid)));
                    for (const t of snap.docs) {
                        await attempt(async () => {
                            const msgs = await getDocs(collection(db, 'threads', t.id, 'messages'));
                            for (const m of msgs.docs) await attempt(() => deleteDoc(m.ref));
                        });
                        await attempt(() => deleteDoc(t.ref));
                    }
                });
                await attempt(() => deleteDoc(doc(db, 'leaderboard', uid)));
                await attempt(() => deleteDoc(doc(db, 'leaderboard_public', uid)));
                await attempt(async () => { const k = await nameKey(name); if (k) await deleteDoc(doc(db, 'nameKeys', k)); });
                await attempt(() => deleteDoc(doc(db, 'users', uid)));
                // 3. delete the login itself, last
                await deleteUser(user);
            } catch (err) {
                console.error(err);
                goBtn.disabled = false; cancelBtn.disabled = false; goBtn.textContent = 'Delete forever';
                errEl.textContent = 'Could not delete the account: ' + friendlyError(err) + ' Please try again, or email genius.tutor.app@gmail.com.';
                return;
            }
            try {
                ['gt_resume_' + uid, 'gt_seen_' + uid, 'gt_lb_' + uid].forEach(k => localStorage.removeItem(k));
            } catch (_) {}
            closeDeleteAccount();
            state.user = null; state.isAdmin = false; state.history = null; state.leaderboard = null; state.pass = null;
            setView('home');
            alert('Your account and data have been deleted.');
        }

        async function handleLogout() {
            await signOut(auth);
            stopMessaging(); state.user = null; state.isAdmin = false; state.history = null; state.leaderboard = null; state.pass = null;

        async function startExamSession() {
            const u = state.user;
            const picks = state.esetup.subjects;
            if (picks.length !== 3) return;
            if (!hasFullAccess()) { alert('Your free trial has ended. Get the 1-year plan to take full exams.'); showDashboard(); return; }
            state.examSubjects = ['english', ...picks];
            state.examData = { english: buildEnglishExam() };
            picks.forEach(sub => { state.examData[sub] = getRandomQuestions(sub, 40); });
            state.activeSubject = 'english';
            state.currentIndex = 0;
            state.answers = {};
            state.flagged = {};
            state.timeLeft = 7200;
            state.sessionId = null;
            state.saveError = false;
            // Fallback (offline): use the device clock. Normally the deadline comes from the server.
            state.serverOffset = 0;
            state.deadline = Date.now() + 7200000;

            try {
                const ref = await addDoc(collection(db, 'sessions'), {
                    uid: u.uid, name: u.name, regNumber: u.regNumber || '',
                    subjects: state.examSubjects, status: 'In progress',
                    startedAt: serverTimestamp()
                });
                state.sessionId = ref.id;
                const snap = await getDoc(ref);
                const t = snap.data() && snap.data().startedAt;
                if (t && t.toMillis) {
                    const startMs = t.toMillis();           // official start time, set by the server
                    state.serverOffset = startMs - Date.now();
                    state.deadline = startMs + 7200000;     // official end time = start + 2 hours
                }
            } catch (err) {
                console.error('Could not log session start', err);
                if (err && err.code === 'permission-denied') {
                    state.pass = { expiresMs: 0, active: false, error: false };
                    if (state.timerInterval) clearInterval(state.timerInterval);
                    alert('Your free trial or pass is not active, so the exam cannot start.');
                    showDashboard();
                    return;
                }
            }

            setView('exam');
            startTimer();
        }

        // --- EXAM ---
        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const tick = () => {
                state.timeLeft = Math.max(0, Math.round((state.deadline - (Date.now() + state.serverOffset)) / 1000));
                updateTimerDisplay();
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    alert('Time is up! Submitting exam automatically.');
                    submitExam();
                }
            };
            state.timerInterval = setInterval(tick, 1000);
            tick();
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (!el) return;
            const h = Math.floor(state.timeLeft / 3600);
            const m = Math.floor((state.timeLeft % 3600) / 60);
            const s = state.timeLeft % 60;
            el.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
            if (state.timeLeft < 300) el.classList.add('text-rose-500', 'animate-pulse');
        }

                                ${esc(subjLabel(sub))} (${state.examData[sub].length} Qs)
                            </button>`).join('')}

                    </div>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 items-start max-w-7xl mx-auto w-full p-4 sm:p-6 gap-4 sm:gap-6">
                        <div class="lg:col-span-3 bg-white border border-[#e8e2d2] rounded-2xl p-4 sm:p-6 lg:p-8 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="flex items-center justify-between mb-6">
                                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-[#e1f3e8] text-[#0b5a3c] border border-[#bfe0cd] uppercase">

                                ${novelTag(q)}<h3 class="text-lg sm:text-xl font-medium text-[#0b3d2b] mb-6 leading-relaxed">${fq(q.question, state.activeSubject)}</h3>

                            </div>
                            <div class="flex items-center justify-between pt-6 mt-6 border-t border-[#e8e2d2]">
                                <button onclick="prevQuestion()" ${(state.currentIndex === 0 && state.examSubjects.indexOf(state.activeSubject) === 0) ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-[#eef1ec] text-[#2f5546] font-semibold text-xs hover:bg-[#e1e7e0] disabled:opacity-40 disabled:cursor-not-allowed transition">← Previous</button>
                                <button onclick="nextQuestion()" ${(state.currentIndex === total - 1 && state.examSubjects.indexOf(state.activeSubject) === state.examSubjects.length - 1) ? 'disabled' : ''} class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/20 disabled:opacity-40 disabled:cursor-not-allowed transition">${(state.currentIndex === total - 1 && state.examSubjects.indexOf(state.activeSubject) < state.examSubjects.length - 1) ? 'Next subject →' : 'Next →'}</button>
                            </div>
                        </div>

                        <div class="bg-white border border-[#e8e2d2] rounded-2xl p-4 sm:p-6 flex flex-col shadow-xl lg:sticky lg:top-32">
                            <h4 class="font-bold text-[#0b3d2b] text-sm mb-2 uppercase tracking-wide">${esc(subjLabel(state.activeSubject))} Palette</h4>
                            <p class="text-xs text-[#58796b] mb-4">Click any number to jump</p>
                            <div class="grid grid-cols-8 sm:grid-cols-10 lg:grid-cols-5 gap-1.5 mb-6">
                                ${questions.map((_, idx) => {
                                    const k = `${state.activeSubject}-${idx}`;
                                    let cls = "bg-[#faf8f2] text-[#58796b] border-[#e8e2d2]";
                                    if (state.answers[k] !== undefined) cls = "bg-[#cfeadb] text-[#0b5a3c] border-[#0b5a3c]";
                                    if (state.currentIndex === idx) cls = "border-2 border-[#0b5a3c] text-[#0b3d2b] bg-[#e1f3e8]";
                                    if (state.flagged[k]) cls = "bg-amber-500/20 text-amber-800 border-amber-500/50";
                                    return `<button onclick="jumpTo(${idx})" class="h-9 rounded-lg font-bold text-xs border transition ${cls}">${idx + 1}</button>`;
                                }).join('')}
                            </div>
                            <div class="mt-auto space-y-2 text-xs text-[#58796b] pt-4 border-t border-[#e8e2d2]">
                                <div class="flex justify-between"><span>Total answered:</span><span class="font-bold text-emerald-700">${totalAnswered} / ${totalCount}</span></div>
                                <div class="flex justify-between"><span>Unanswered:</span><span class="font-bold text-[#2f5546]">${totalCount - totalAnswered}</span></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function switchSubject(sub) { state.activeSubject = sub; state.currentIndex = 0; render(); }
        function selectOption(i) { state.answers[`${state.activeSubject}-${state.currentIndex}`] = i; render(); }
        function toggleFlag() { const k = `${state.activeSubject}-${state.currentIndex}`; state.flagged[k] = !state.flagged[k]; render(); }
        function nextQuestion() {
            if (state.currentIndex < state.examData[state.activeSubject].length - 1) { state.currentIndex++; render(); window.scrollTo(0, 0); return; }
            // last question of a subject: go on to the first question of the next subject
            const i = state.examSubjects.indexOf(state.activeSubject);
            if (i >= 0 && i < state.examSubjects.length - 1) { state.activeSubject = state.examSubjects[i + 1]; state.currentIndex = 0; render(); window.scrollTo(0, 0); }
        }
        function prevQuestion() {
            if (state.currentIndex > 0) { state.currentIndex--; render(); window.scrollTo(0, 0); return; }
            // first question of a subject: go back to the last question of the previous subject
            const i = state.examSubjects.indexOf(state.activeSubject);
            if (i > 0) { const prev = state.examSubjects[i - 1]; state.activeSubject = prev; state.currentIndex = state.examData[prev].length - 1; render(); window.scrollTo(0, 0); }
        }
        function jumpTo(i) { state.currentIndex = i; render(); }
        function confirmSubmit() { if (confirm('Are you sure you want to submit your complete 4-subject JAMB exam?')) submitExam(); }

        function computeResult() {
            let totalScore = 0, totalCount = 0;
            const breakdown = {};
            state.examSubjects.forEach(sub => {
                let sc = 0;
                state.examData[sub].forEach((q, idx) => { if (state.answers[`${sub}-${idx}`] === q.answer) sc++; });
                breakdown[sub] = { score: sc, total: state.examData[sub].length };
                totalScore += sc;
                totalCount += state.examData[sub].length;
            });
            return { totalScore, totalCount, breakdown, scaled: Math.round((totalScore / totalCount) * 400) };
        }

        function buildReviewItems() {
            const items = [];
            state.examSubjects.forEach(sub => {
                state.examData[sub].forEach((q, idx) => {
                    const c = state.answers[`${sub}-${idx}`];
                    items.push({ s: sub, q: q.question, o: q.options, a: q.answer, c: c === undefined ? -1 : c, p: q.passage || null, n: q.novel ? 1 : 0 });
                });
            });
            return items;
        }

        async function submitExam() {
            if (state.currentView !== 'exam') return;
            if (state.timerInterval) clearInterval(state.timerInterval);
            clearProgress();
            const r = computeResult();
            state.saveError = false;
            setView('result');
            if (!state.sessionId) { state.saveError = true; render(); return; }
            try {
                await updateDoc(doc(db, 'sessions', state.sessionId), {
                    status: 'Completed',
                    rawScore: r.totalScore,
                    totalQuestions: r.totalCount,
                    scaledScore: r.scaled,
                    breakdown: r.breakdown,
                    submittedAt: serverTimestamp()
                });
                await setDoc(doc(db, 'reviews', state.sessionId), { uid: state.user.uid, items: buildReviewItems() });
                state.history = null;
            } catch (err) {
                console.error('Could not save result', err);
                state.saveError = true;
                if (state.currentView === 'result') render();
            }
        }

        // --- RESULT ---
        function renderResult() {
            const r = computeResult();
            let prediction = "Needs Improvement 📚";
            let color = "text-amber-700 bg-amber-500/10 border-amber-500/20";
            if (r.scaled >= 280) { prediction = "Outstanding! High likelihood for competitive courses 🌟"; color = "text-emerald-700 bg-emerald-500/10 border-emerald-500/20"; }
            else if (r.scaled >= 200) { prediction = "Good standing! Admission eligible 👍"; color = "text-[#0b5a3c] bg-[#e1f3e8] border-[#bfe0cd]"; }

            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2]">
                    <div class="max-w-2xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-8 shadow-xl">
                        <div class="text-center mb-6">
                            <span class="bg-emerald-500/10 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-emerald-500/20">Graded</span>
                            <h2 class="text-3xl font-bold text-[#0b3d2b] mt-3">Examination Scorecard</h2>
                            <p class="text-[#58796b] text-sm">Candidate: <span class="text-[#0b3d2b] font-medium">${esc(state.user.name)}</span>${state.user.regNumber ? ' (' + esc(state.user.regNumber) + ')' : ''}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-6 text-center">
                            <div class="bg-[#faf8f2] p-5 rounded-xl border border-[#e8e2d2]">
                                <span class="text-xs text-[#7a9588] uppercase font-semibold">Scaled score</span>
                                <p class="text-4xl font-extrabold text-[#0b5a3c] mt-1">${r.scaled} <span class="text-lg text-[#7a9588]">/ 400</span></p>
                            </div>
                            <div class="bg-[#faf8f2] p-5 rounded-xl border border-[#e8e2d2]">
                                <span class="text-xs text-[#7a9588] uppercase font-semibold">Correct</span>
                                <p class="text-4xl font-extrabold text-emerald-700 mt-1">${r.totalScore} <span class="text-lg text-[#7a9588]">/ ${r.totalCount}</span></p>
                                <p class="text-xs text-[#58796b] mt-1">${Math.round(r.totalScore / r.totalCount * 100)}% correct</p>
                            </div>
                        </div>
                        <div class="bg-[#faf8f2] p-4 rounded-xl border border-[#e8e2d2] mb-6 space-y-3">
                            <h4 class="font-bold text-[#0b3d2b] text-xs uppercase tracking-wide">Subject Breakdown</h4>
                            <div class="grid grid-cols-2 gap-3">
                                ${Object.entries(r.breakdown).map(([sub, d]) => `
                                    <div class="bg-white p-3 rounded-lg border border-[#e8e2d2] flex justify-between items-center">
                                        <span class="text-xs text-[#2f5546] uppercase font-medium">${esc(sub)}</span>
                                        <span class="text-xs font-bold text-[#0b5a3c]">${d.score} / ${d.total}</span>
                                    </div>`).join('')}
                            </div>
                        </div>
                        <div class="border rounded-xl p-4 mb-8 flex items-center justify-between ${color}">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider opacity-80">Admission Readiness</span>
                                <p class="text-sm font-bold mt-1">${prediction}</p>
                            </div>
                            <span class="text-2xl">🎯</span>
                        </div>
                        ${state.saveError ? `<div class="mb-4 text-xs bg-amber-500/10 border border-amber-500/30 text-amber-800 rounded-xl p-3 leading-relaxed">Your result could not be saved to your account (no connection, or the exam time had already ended). You can still review your answers below.</div>` : ''}
                        <div class="flex gap-3">
                            <button onclick="startReview()" class="flex-1 bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#0b3d2b] font-semibold py-3 rounded-xl transition">Review answers</button>
                            <button onclick="showDashboard()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">Dashboard</button>
                        </div>
                    </div>
                </div>`;
        }

        // --- CONTINUE AN UNFINISHED ATTEMPT (exam, WAEC paper and both practice modes) ---
        // The attempt is saved on this phone/computer after every answer. The student comes straight back to it after leaving the page.
        const RESUME_MAX_MS = { exam: 86400000, waec: 86400000, practice: 3 * 86400000, waecPractice: 3 * 86400000 };
        function resumeKey(uid) { return 'gt_resume_' + uid; }
        function readResume(uid) {
            try {
                const snap = JSON.parse(localStorage.getItem(resumeKey(uid)) || 'null');
                if (!snap || !snap.kind) return null;
                if (Date.now() - snap.savedAt > (RESUME_MAX_MS[snap.kind] || 86400000)) { localStorage.removeItem(resumeKey(uid)); return null; }
                return snap;
            } catch (_) { return null; }
        }
        function clearProgress() { try { if (state.user) localStorage.removeItem(resumeKey(state.user.uid)); } catch (_) {} }
        function saveProgress() {
            try {
                if (!state.user) return;
                const v = state.currentView;
                let snap = null;
                if (v === 'exam') {
                    snap = { kind: 'exam', examSubjects: state.examSubjects, examData: state.examData, activeSubject: state.activeSubject, currentIndex: state.currentIndex,
                        answers: state.answers, flagged: state.flagged, deadline: state.deadline, serverOffset: state.serverOffset, sessionId: state.sessionId };
                } else if (v === 'practice' && state.practice) {
                    const { timerRef, ...P } = state.practice;
                    snap = { kind: P.style === 'waec' ? 'waecPractice' : 'practice', P };
                } else if (v === 'waec' && state.waec) {
                    snap = { kind: 'waec', W: state.waec };
                }
                if (!snap) return;
                snap.savedAt = Date.now();
                localStorage.setItem(resumeKey(state.user.uid), JSON.stringify(snap));
            } catch (e) { console.error('Could not save progress', e); }
        }
        // returns true when an attempt was reopened
        function resumeAttempt() {
            const s = state.user && readResume(state.user.uid);
            if (!s) return false;
            if (s.kind === 'exam') {
                Object.assign(state, { examSubjects: s.examSubjects, examData: s.examData, activeSubject: s.activeSubject, currentIndex: s.currentIndex,
                    answers: s.answers || {}, flagged: s.flagged || {}, deadline: s.deadline, serverOffset: s.serverOffset || 0, sessionId: s.sessionId, saveError: false });
                setView('exam', 'Welcome back. Your exam continues where you stopped, and the clock kept running.');
                startTimer();
            } else if (s.kind === 'waec') {
                state.waec = s.W;
                setView('waec');
                startWaecTimer();
            } else {
                if (!hasPracticeAccess()) { clearProgress(); return false; }
                // practice time is paused while the student is away
                state.practice = { ...s.P, deadline: Date.now() + Math.max(1, s.P.timeLeft) * 1000, timedOut: false };
                setView('practice');
                startPracticeTimer();
            }
            window.scrollTo(0, 0);
            return true;
        }
        setInterval(saveProgress, 10000);
        window.addEventListener('pagehide', saveProgress);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });

// --- EXPLANATIONS (explanations.js: window.EXPLAIN maps a question fingerprint to a short explanation) ---
        function explainHtml(i) {
            const savedExplanation = window.EXPLAIN && window.EXPLAIN[keyOf([i.q, i.o[i.a]])];
            const subjectId = String(i.s || '').toLowerCase().replace(/[^a-z]/g, '');
            // Citizenship and Heritage Studies questions should always have an explanation,
            // even when no individually authored explanation exists in explanations.js.
            const e = savedExplanation || (subjectId.includes('citizenship') || subjectId.includes('heritage')
                ? `The correct answer is "${i.o[i.a]}". This option directly answers the question. In Citizenship and Heritage Studies, the concept is understood by connecting the answer to citizens' rights and duties, national identity, culture, history, or the preservation of Nigeria's heritage, as relevant to the question.`
                : '');
            return e ? `<div class="mt-3 text-sm bg-[#f4f8f6] border border-[#cfe5d8] rounded-xl p-3 leading-relaxed text-[#2f5546]"><span class="font-semibold text-[#0b5a3c]">Explanation: </span>${fq(e, i.s)}</div>` : '';
        }

// --- PROGRESS, HISTORY AND ANSWER REVIEW ---
        // True when the 1-month free trial is over and the student has no active pass (admins and pass-check errors never lock).
        function isLockedOut() {
            if (!state.user || state.isAdmin || !state.pass || state.pass.error || state.pass.active) return false;
            const end = trialEndMs();
            return end > 0 && Date.now() >= end;
        }

        function renderLocked() {
            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2] text-[#0b3d2b]">
                    <header class="bg-gradient-to-b from-[#0b6b45] to-[#00170f] px-4 sm:px-8 py-3">
                        <div class="leading-tight text-white">
                            <p class="font-display font-bold text-xs tracking-wide">GENIUS CBT</p>
                            <p class="text-[9px] font-semibold tracking-[0.2em] text-[#f4b731]">UTME · WAEC · NECO · GCE</p>
                        </div>
                    </header>
                    <main class="flex-1 px-4 pt-6 pb-10">
                        <div class="max-w-sm sm:max-w-md mx-auto">
                            <div class="bg-[#f6ecc9] border border-[#ecdca4] text-[#8a6500] rounded-2xl p-4 text-sm leading-relaxed mb-4">
                                ⏰ <strong>Your 1-month free trial has ended.</strong> To keep using Genius CBT, get the 1-year plan${priceParen()}. It unlocks everything.
                            </div>
                            ${payBoxHtml()}
                            <div class="flex flex-wrap gap-2 mt-4">
                                <button onclick="refreshPass().then(showDashboard)" class="border border-[#d9d4c3] hover:border-[#0b5a3c] font-semibold text-sm rounded-xl px-4 py-3 transition">${IS_PLAY_APP ? 'Check again' : 'My payment is confirmed, check again'}</button>
                                <button onclick="handleLogout()" class="text-sm font-semibold text-[#0b5a3c] px-3 py-3 hover:underline">Sign out</button>
                            </div>
                        </div>
                    </main>
                </div>`;
        }

        async function showDashboard() {
            if (!state.user) { setView('dashboard'); return; }
            if (state.pass === null) { setView('loading'); await loadPass(); }
            if (isLockedOut()) { setView('locked'); window.scrollTo(0, 0); return; }
            if (resumeAttempt()) return;
            setView('dashboard');
            maybeShowPlanReminder();
            if (state.history === null) {
                state.leaderboard = null;
                await loadHistory();
                if (state.currentView === 'dashboard') render();
                await loadLeaderboard();
                if (state.currentView === 'dashboard') render();
            }
        }

        function publicName(n) {
            const parts = String(n || '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return 'Student';
            const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
            return parts.length > 1 ? cap(parts[0]) + ' ' + parts[parts.length - 1].charAt(0).toUpperCase() + '.' : cap(parts[0]);
        }

        // Students see WHO is on the leaderboard (leaderboard_public: names only). Scores live in the private `leaderboard`
        // collection, which only the admin can read. Both are written here when a student's results change.
        async function loadLeaderboard() {
            try {
                const uid = state.user.uid;
                const h = state.history || [];
                const myBest = h.length ? Math.max(...h.map(x => x.scaledScore)) : null;
                if (myBest !== null) {
                    const nm = publicName(state.user.name);
                    const mark = myBest + '|' + h.length;
                    let last = '';
                    try { last = localStorage.getItem('gt_lb_' + uid) || ''; } catch (_) {}
                    const pubRef = doc(db, 'leaderboard_public', uid);
                    let needPublic = last !== mark;
                    if (!needPublic) { const ps = await getDoc(pubRef); needPublic = !ps.exists() || ps.data().name !== nm; }
                    if (needPublic) {
                        try { await setDoc(pubRef, { uid, name: nm, updatedAt: serverTimestamp() }); } catch (e) { console.error('public leaderboard write', e); }
                    }
                    if (last !== mark) {
                        try {
                            await setDoc(doc(db, 'leaderboard', uid), { uid, name: nm, bestScore: myBest, exams: h.length, updatedAt: serverTimestamp() });
                            try { localStorage.setItem('gt_lb_' + uid, mark); } catch (_) {}
                        } catch (e) { console.error('private leaderboard write', e); }
                    }
                }
                if (state.isAdmin) {
                    const snap = await getDocs(query(collection(db, 'leaderboard'), orderBy('bestScore', 'desc'), limit(10)));
                    state.leaderboard = { mode: 'scores', rows: snap.docs.map(d => ({ id: d.id, ...d.data() })), myBest };
                } else {
                    const snap = await getDocs(query(collection(db, 'leaderboard_public'), orderBy('updatedAt', 'desc'), limit(20)));
                    state.leaderboard = { mode: 'names', rows: snap.docs.map(d => ({ id: d.id, ...d.data() })), myBest };
                }
            } catch (err) {
                console.error('Could not load leaderboard', err);
                state.leaderboard = { error: err.code || 'error', rows: [] };
            }
        }

        async function refreshLeaderboard() {
            state.leaderboard = null;
            render();
            await loadLeaderboard();
            if (state.currentView === 'dashboard') render();
        }

        async function loadHistory() {
            try {
                const snap = await getDocs(query(collection(db, 'sessions'), where('uid', '==', state.user.uid)));
                const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                state.practiceHistory = all.filter(x => x.mode === 'practice');
                state.waecHistory = all.filter(x => x.mode === 'waec' && x.status === 'Completed');
                state.history = all
                    .filter(x => x.mode !== 'practice' && x.mode !== 'waec' && x.status === 'Completed' && x.scaledScore !== undefined)
                    .sort((a, b) => ((b.startedAt && b.startedAt.toMillis ? b.startedAt.toMillis() : 0) - (a.startedAt && a.startedAt.toMillis ? a.startedAt.toMillis() : 0)));
            } catch (err) {
                console.error('Could not load history', err);
                state.history = [];
            }
        }

        function startReview() {
            state.review = { items: buildReviewItems(), tab: 'all', back: 'result', sid: state.sessionId };
            setView('review');
            window.scrollTo(0, 0);
        }

        async function reviewPast(id) {
            try {
                const snap = await getDoc(doc(db, 'reviews', id));
                if (!snap.exists()) { alert('The answer review for this attempt is not available.'); return; }
                state.review = { items: snap.data().items, tab: 'all', back: 'dashboard', sid: id };
                setView('review');
                window.scrollTo(0, 0);
            } catch (err) { alert(friendlyError(err)); }
        }

        function closeReview() { closeQChat(true); const b = state.review && state.review.back; if (b === 'result') setView('result'); else if (b === 'practiceResult') setView('practiceResult'); else if (b === 'waecResult') setView('waecResult'); else showDashboard(); }
        function setReviewTab(t) { state.review.tab = t; render(); window.scrollTo(0, 0); }

        function renderReview() {
            const R = state.review;
            const subs = [...new Set(R.items.map(i => i.s))];
            const shown = R.items.filter(i => R.tab === 'all' || i.s === R.tab);
            let right = 0, wrong = 0, skipped = 0;
            shown.forEach(i => { if (i.c === -1) skipped++; else if (i.c === i.a) right++; else wrong++; });
            const counter = {};
            let lastP = null;
            const cards = shown.map(i => {
                counter[i.s] = (counter[i.s] || 0) + 1;
                let passageHtml = '';
                if (i.p && i.p !== lastP) {
                    passageHtml = `<div class="mb-4 p-4 rounded-xl bg-[#faf8f2] border border-[#e8e2d2] text-sm text-[#2f5546] leading-relaxed"><p class="text-xs font-semibold text-[#0b5a3c] uppercase mb-2">Passage</p>${esc(i.p)}</div>`;
                }
                lastP = i.p;
                const status = i.c === -1 ? ['Not answered', 'text-[#58796b]'] : (i.c === i.a ? ['Correct', 'text-emerald-700'] : ['Wrong', 'text-rose-700']);
                const opts = i.o.map((opt, idx) => {
                    let cls = 'border-[#e8e2d2] bg-[#faf8f2] text-[#2f5546]', tag = '';
                    if (idx === i.a) { cls = 'border-emerald-500 bg-emerald-500/10 text-emerald-800'; tag = idx === i.c ? '✓ Your answer · Correct' : '✓ Correct answer'; }
                    else if (idx === i.c) { cls = 'border-rose-500 bg-rose-500/10 text-rose-800'; tag = '✗ Your answer'; }
                    return `
                        <div class="flex items-start gap-3 p-3 rounded-xl border ${cls}">
                            <span class="w-6 h-6 shrink-0 rounded-md flex items-center justify-center font-bold text-xs bg-white border border-[#e8e2d2]">${String.fromCharCode(65 + idx)}</span>
                            <div class="text-sm"><span>${fq(opt, i.s)}</span>${tag ? `<p class="text-[11px] font-semibold mt-0.5">${tag}</p>` : ''}</div>
                        </div>`;
                }).join('');
                return `${passageHtml}
                    <div class="bg-white border border-[#e8e2d2] rounded-2xl p-5 mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold uppercase text-[#0b5a3c]">${esc(i.s)} · Question ${counter[i.s]}</span>
                            <span class="text-xs font-semibold ${status[1]}">${status[0]}</span>
                        </div>
                        ${i.n ? novelTag({ novel: true }) : ''}<h3 class="text-base font-medium text-[#0b3d2b] mb-4 leading-relaxed">${fq(i.q, i.s)}</h3>
                        <div class="space-y-2">${opts}</div>
                        ${explainHtml(i)}
                        ${qChatHtml(i, R.items.indexOf(i))}
                    </div>`;
            }).join('');
            const tabBtn = (key, label) => `<button onclick="setReviewTab('${key}')" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider whitespace-nowrap transition ${R.tab === key ? 'bg-indigo-600 text-white' : 'bg-white text-[#58796b] border border-[#e8e2d2]'}">${label}</button>`;
            return `
                <div class="flex-1 bg-[#faf8f2]">
                    <div class="max-w-3xl mx-auto p-4 sm:p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-bold text-[#0b3d2b]">Answer review</h2>
                            <button onclick="closeReview()" class="bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546] text-xs font-semibold px-4 py-2.5 rounded-xl transition">← Back</button>
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2">${tabBtn('all', 'All')}${subs.map(x => tabBtn(x, esc(x))).join('')}</div>
                        <div class="grid grid-cols-3 gap-2 my-4 text-center text-xs">
                            <div class="bg-white border border-[#e8e2d2] rounded-xl p-3"><p class="text-lg font-bold text-emerald-700">${right}</p>Correct</div>
                            <div class="bg-white border border-[#e8e2d2] rounded-xl p-3"><p class="text-lg font-bold text-rose-700">${wrong}</p>Wrong</div>
                            <div class="bg-white border border-[#e8e2d2] rounded-xl p-3"><p class="text-lg font-bold text-[#2f5546]">${skipped}</p>Not answered</div>
                        </div>
                        ${cards}
                        <button onclick="closeReview()" class="w-full bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#0b3d2b] font-semibold py-3 rounded-xl transition mb-6">← Back</button>
                    </div>
                </div>`;
        }

// --- PRACTICE MODE ---
        function availableFor(sub, noNovel) {
            if (sub === 'english' && window.ENGLISH) {
                const E = window.ENGLISH;
                return (E.general || []).length + (noNovel ? 0 : (E.novel || []).length) + Object.keys(E.passages || {}).length * 5;
            }
            if (noNovel) { const pool = waecPool(sub, WAEC_QS); if (pool.length) return pool.length; }   // WAEC/NECO/GCE screens
            if (REAL_BANKS[sub] && REAL_BANKS[sub].length) return REAL_BANKS[sub].length;
            return 125;
        }

        // --- JAMB PRACTICE BUILDER: fixed size, topics in equal shares, no repeats until the bank is used up ---
        const JAMB_PRACTICE = { english: 20, novel: 3, other: 10 };   // 20 English (3 from the novel), 10 from each other subject
        function seenStore() { try { return JSON.parse(localStorage.getItem('gt_seen_' + state.user.uid) || '{}'); } catch (_) { return {}; } }
        function saveSeen(o) { try { localStorage.setItem('gt_seen_' + state.user.uid, JSON.stringify(o)); } catch (_) {} }
        function markSeen(bucket, key) {
            const o = seenStore(), a = o[bucket] = o[bucket] || [];
            if (!a.includes(key)) { a.push(key); saveSeen(o); }
        }
        // take one question from each topic in turn (in a random order) until we have enough
        function roundRobin(list, count) {
            const by = {};
            list.forEach(x => { const t = x.r[5] || 'General'; (by[t] = by[t] || []).push(x); });
            const topics = shuffleArr(Object.keys(by));
            topics.forEach(t => { by[t] = shuffleArr(by[t]); });
            const out = [];
            while (out.length < count && topics.some(t => by[t].length)) {
                for (const t of topics) { if (out.length >= count) break; const x = by[t].pop(); if (x) out.push(x); }
            }
            return out;
        }
        // rows: raw bank rows. bucket: name used to remember what this student has already practised.
        function balancedPick(rows, count, bucket) {
            const seen = new Set(seenStore()[bucket] || []);
            const all = rows.map(r => ({ r, k: keyOf(r) }));
            let picked = roundRobin(all.filter(x => !seen.has(x.k)), count);
            if (picked.length < count) {
                // every unseen question is used up: start a fresh round and top up from the old ones
                const o = seenStore(); o[bucket] = []; saveSeen(o);
                const got = new Set(picked.map(x => x.k));
                picked = picked.concat(roundRobin(all.filter(x => !got.has(x.k)), count - picked.length));
            }
            return picked.map(x => x.r);
        }
        function buildJambPractice(subs) {
            const items = [];
            subs.forEach(sub => {
                let part;
                if (sub === 'english' && window.ENGLISH) {
                    const E = window.ENGLISH;
                    const gen = balancedPick(E.general || [], JAMB_PRACTICE.english - JAMB_PRACTICE.novel, 'english').map(r => toItem(r, null, { seenKey: 'english' }));
                    const nov = balancedPick(E.novel || [], JAMB_PRACTICE.novel, 'english-novel').map(r => toItem(r, null, { novel: true, seenKey: 'english-novel' }));
                    part = [...gen, ...nov];
                } else if (REAL_BANKS[sub] && REAL_BANKS[sub].length) {
                    part = balancedPick(REAL_BANKS[sub], JAMB_PRACTICE.other, sub).map(r => toItem(r, null, { seenKey: sub }));
                } else {
                    part = getRandomQuestions(sub, sub === 'english' ? JAMB_PRACTICE.english : JAMB_PRACTICE.other);
                }
                part.forEach(q => items.push({ ...q, subject: sub }));
            });
            return items;
        }

        function buildPracticeEnglish(n, noNovel) {
            const E = window.ENGLISH;
            if (!E) return getRandomQuestions('english', n);
            const out = [];
            const keys = Object.keys(E.passages || {});
            if (n >= 20 && keys.length) {
                const k = shuffleArr(keys)[0];
                E.passages[k].qs.forEach(r => out.push(toItem(r, E.passages[k].text)));
            }
            const pool = noNovel ? [...(E.general || [])] : [...(E.general || []), ...(E.novel || [])];
            const gen = shuffleArr(pool).slice(0, Math.max(0, n - out.length)).map(r => toItem(r, null, (E.novel || []).includes(r) ? { novel: true } : null));
            return [...out, ...gen];
        }

        function formatClock(sec) {
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return (h ? [h, m, s] : [m, s]).map(n => String(n).padStart(2, '0')).join(':');
        }

        function updatePracticeTimer() {
            const el = document.getElementById('practice-timer');
            if (!el || !state.practice) return;
            el.textContent = formatClock(state.practice.timeLeft);
            if (state.practice.timeLeft < 60) el.classList.add('text-rose-600', 'animate-pulse');

        function startPracticeTimer() {
            if (practiceInterval) clearInterval(practiceInterval);

                                <button onclick="practiceNext()" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/20 transition">${isLast ? 'Submit' : ((P.items[P.index + 1] && P.items[P.index + 1].subject !== q.subject) ? 'Next subject →' : 'Next →')}</button>

        function startPracticeReview() {

        function renderPracticeResult() {
            const P = state.practice;

            const msg = P.timedOut ? 'Time ran out. Unanswered questions count as wrong. ⏱️' : (pct >= 70 ? 'Great work! Keep it up. 🌟' : (pct >= 50 ? 'Good effort. Review the ones you missed. 👍' : 'Keep practising. Review your answers to learn from them. 📚'));
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2]">

                        <p class="text-sm text-[#58796b] mt-4">${msg}</p>
                        <div class="grid grid-cols-2 gap-2 mt-6 text-left">
                            ${Object.entries(bd).map(([sub, d]) => `
                                <div class="bg-[#faf8f2] p-3 rounded-lg border border-[#e8e2d2] flex justify-between items-center">
                                    <span class="text-xs text-[#2f5546] font-medium">${esc(subjLabel(sub))}</span>
                                    <span class="text-xs font-bold text-[#0b5a3c]">${d.score} / ${d.total}</span>
                                </div>`).join('')}
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8">
                            <button onclick="startPracticeReview()" class="bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#0b3d2b] font-semibold py-3 rounded-xl transition">Review answers</button>
                            <button onclick="${P.style === 'waec' ? 'startWaecPractice()' : 'startPractice()'}" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-semibold py-3 rounded-xl transition">Practise again</button>
                            <button onclick="showDashboard()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">Dashboard</button>
                        </div>
                    </div>
                </div>`;
        }

        // --- ADMIN (access controlled by the admins/{uid} document + Firestore rules) ---
        // --- FREE TRIAL: practice is free for 1 month after registration, then needs the 1-year plan ---
        const TRIAL_DAYS = 30;   // 1 month free trial
        const WAEC_PRACTICE_SECS_PER_Q = 60;   // WAEC/NECO/GCE pace: 60 questions in 60 minutes

        function trialEndMs() {
            const c = state.user && state.user.createdAt;
            const ms = c && c.toMillis ? c.toMillis() : 0;
            return ms ? ms + TRIAL_DAYS * 86400000 : 0;   // 0 = unknown, so we do not lock anyone by mistake
        }

        function hasPracticeAccess() {
            if (hasActivePass()) return true;
            const end = trialEndMs();
            return end === 0 || Date.now() < end;
        }

        // During the free trial a student has FULL access: JAMB exam, WAEC/NECO/GCE exam, both practice modes and the WhatsApp group.
        function hasFullAccess() { return hasPracticeAccess(); }

        function passWaUrl() {
            const u = state.user;
            return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent('Hello, I want a Genius CBT 1-year plan (' + PASS_PRICE + '). Name: ' + u.name + '. Email: ' + u.email);
        }

        function practiceGateHtml(fn, label) {
            if (hasPracticeAccess()) return `<button onclick="${fn}" class="mt-5 bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm rounded-xl px-5 py-3 transition self-start">${label}</button>`;
            if (state.pass === null) return `<p class="mt-5 text-sm text-[#0b3d2b]/60">Checking your pass…</p>`;
            return `<div class="mt-4 bg-[#f6ecc9] border border-[#ecdca4] text-[#8a6500] rounded-xl p-3 text-sm leading-relaxed">🔒 Your 1-month free trial has ended. Get the 1-year plan${priceParen()} to keep practising.</div>
                <div class="flex flex-wrap gap-2 mt-3">
                    <button onclick="goPay()" class="bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm rounded-xl px-5 py-3 transition">Activate 1-year plan</button>
                    <button onclick="refreshPass()" class="border border-[#d9d4c3] hover:border-[#0b5a3c] font-semibold text-sm rounded-xl px-4 py-3 transition">${IS_PLAY_APP ? 'Check again' : 'I have paid, check again'}</button>
                </div>`;
        }

        const REMIND_DAYS = 5;   // remind the student when 5 days or fewer are left
        function daysLeft(ms) { return Math.ceil((ms - Date.now()) / 86400000); }
        const plural = n => n + ' ' + (n === 1 ? 'day' : 'days');

        function trialBannerHtml() {
            if (state.isAdmin || state.pass === null || state.pass.error) return '';
            const btn = label => `<button onclick="goPay()" class="inline-block mt-3 bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm rounded-xl px-5 py-2.5 transition">${label}</button>`;
            const amber = 'mt-4 bg-[#f6ecc9] border border-[#ecdca4] text-[#8a6500] rounded-2xl p-4 text-sm leading-relaxed';
            if (hasActivePass()) {   // a paid month that is about to finish
                const end = state.pass.expiresMs, d = daysLeft(end);
                if (d > 0 && d <= REMIND_DAYS) return `<div class="${amber}">⏰ <strong>Reminder: your 1-year plan ends in ${plural(d)}</strong> (on ${esc(fmtDate(end))}). Renew ${priceFor()}so you do not lose access to your exams and practice.<br>${btn('Renew 1-year plan' + priceParen())}</div>`;
                return '';
            }
            const end = trialEndMs();
            if (!end) return '';
            const d = daysLeft(end);
            if (d > REMIND_DAYS) return `<div class="mt-4 bg-[#e7f3ec] border border-[#cfe5d8] rounded-2xl p-4 text-sm leading-relaxed">🎁 <strong>1 month free trial: ${plural(d)} left</strong> (until ${esc(fmtDate(end))}). You have full access during the trial: JAMB and WAEC/NECO/GCE exams and practice, plus the WhatsApp help desk. After that you need the 1-year plan${priceParen()}.</div>`;
            if (d > 0) return `<div class="${amber}">⏰ <strong>Reminder: your free trial ends in ${plural(d)}</strong> (on ${esc(fmtDate(end))}). Activate the 1-year plan${priceParen()} now so you can keep practising and take the JAMB exam and WAEC/NECO/GCE papers without a break.<br>${btn('Activate 1-year plan' + priceParen())}</div>`;
            return `<div class="${amber}">⏰ <strong>Your 1-month free trial has ended.</strong> Activate the 1-year plan${priceParen()} to keep practising and to unlock the JAMB exam and WAEC/NECO/GCE papers.<br>${btn('Activate 1-year plan' + priceParen())}</div>`;
        }

        // A pop-up reminder, shown once a day when 5 days or fewer are left (free trial or paid month)
        function maybeShowPlanReminder() {
            if (!state.user || state.isAdmin || state.pass === null || state.pass.error || state.currentView !== 'dashboard') return;
            let kind = '', end = 0;
            if (hasActivePass()) { end = state.pass.expiresMs; kind = 'plan'; } else { end = trialEndMs(); kind = 'trial'; }
            if (!end) return;
            const d = daysLeft(end);
            if (d <= 0 || d > REMIND_DAYS) return;
            const key = 'gt_remind_' + state.user.uid + '_' + kind + '_' + new Date().toISOString().slice(0, 10);
            try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (_) {}
            closePlanReminder();
            const box = document.createElement('div');
            box.id = 'plan-reminder';
            box.className = 'fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4';
            box.innerHTML = `<div class="bg-white text-[#0b3d2b] rounded-2xl shadow-2xl max-w-sm w-full p-6">
                <p class="text-3xl mb-2">⏰</p>
                <h3 class="font-display font-bold text-lg">${kind === 'trial' ? 'Your free trial ends in ' + plural(d) : 'Your 1-year plan ends in ' + plural(d)}</h3>
                <p class="text-sm leading-relaxed mt-2 text-[#2f5546]">${kind === 'trial'
                    ? 'Activate the 1-year plan ' + priceFor() + 'before ' + esc(fmtDate(end)) + ' so you can keep practising and take the full JAMB exam and WAEC/NECO/GCE papers.'
                    : 'Renew ' + priceFor() + 'before ' + esc(fmtDate(end)) + ' so you do not lose access.'}</p>
                <div class="flex gap-2 mt-5">
                    <button onclick="closePlanReminder(); goPay()" class="flex-1 bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm rounded-xl px-4 py-3 transition">${kind === 'trial' ? 'Activate now' : 'Renew now'}</button>
                    <button onclick="closePlanReminder()" class="px-4 py-3 text-sm font-semibold text-[#58796b] hover:text-[#0b3d2b]">Later</button>
                </div></div>`;
            document.body.appendChild(box);
        }
        function closePlanReminder() { const el = document.getElementById('plan-reminder'); if (el) el.remove(); }

        // --- WAEC/NECO/GCE PRACTICE: one subject, instant feedback, timed at WAEC/NECO/GCE pace ---
        function openWaecPractice() {
            if (!hasPracticeAccess()) { alert('Your 1-month free trial has ended. Get the 1-year plan to continue.'); return; }
            setView('waecPracticeSetup');
            window.scrollTo(0, 0);
        }
        const WAEC_PRACTICE_QS = 10;   // WAEC/NECO/GCE practice is always 10 questions
        function setWpCount(n) { state.wpsetup.count = WAEC_PRACTICE_QS; render(); }
        function pickWpSubject(sub) { state.wpsetup.subject = sub; render(); }

        function renderWaecPracticeSetup() {
            const ws = state.wpsetup;
            const subs = ['english', ...OTHER_SUBJECTS];
            const avail = availableFor(ws.subject, true);
            const n = Math.min(WAEC_PRACTICE_QS, avail);
            const btn = sub => {
                const on = ws.subject === sub;
                return `<button onclick="pickWpSubject('${sub}')" class="text-left p-3 rounded-xl border text-sm font-semibold transition ${on ? 'bg-[#e1f3e8] border-[#066c43] text-[#0b3d2b]' : 'bg-[#faf8f2] border-[#e8e2d2] text-[#2f5546] hover:border-[#0b5a3c]'}">
                    <span class="flex items-center justify-between gap-2">
                        <span>${esc(subjLabel(sub))}</span>
                        <span class="w-5 h-5 shrink-0 rounded-full border flex items-center justify-center text-[11px] ${on ? 'bg-[#066c43] border-[#066c43] text-white' : 'border-[#c9c3ad] text-transparent'}">✓</span>
                    </span>
                    ${hasWaecQuestions(sub) ? '' : '<span class="block text-[10px] font-medium text-[#8a6500] mt-1">Sample questions</span>'}
                </button>`;
            };
            const pill = on => `px-4 py-3 rounded-xl text-sm font-semibold border transition ${on ? 'bg-indigo-600 text-white border-[#0b5a3c]' : 'bg-[#faf8f2] text-[#2f5546] border-[#e8e2d2] hover:border-[#0b5a3c]'}`;
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2] text-[#0b3d2b]">
                    <div class="max-w-xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-6 sm:p-8 shadow-xl">
                        <span class="bg-amber-400/10 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-amber-400/20">WAEC/NECO/GCE practice</span>
                        <h2 class="text-2xl font-bold mt-3">Practise one subject</h2>
                        <p class="text-[#58796b] text-sm mt-1 leading-relaxed">Timed at WAEC/NECO/GCE pace. The correct answers and explanations are shown after you submit.</p>
                        <p class="text-xs text-[#7a9588] uppercase font-semibold mt-6 mb-2">Subject</p>
                        <div class="grid grid-cols-2 gap-2">${subs.map(btn).join('')}</div>
                        ${avail < WAEC_PRACTICE_QS ? `<p class="text-xs text-amber-800 mt-2">Only ${avail} ${esc(subjLabel(ws.subject))} questions are available right now.</p>` : ''}
                        <div class="mt-5 text-sm bg-[#faf8f2] border border-[#e8e2d2] rounded-xl p-3 leading-relaxed">
                            ⏱️ <strong>${n} questions</strong> · about <strong>${Math.max(1, Math.round(n * WAEC_PRACTICE_SECS_PER_Q / 60))} minutes</strong> (${WAEC_PRACTICE_SECS_PER_Q} seconds per question).
                        </div>
                        <div class="flex gap-3 mt-8">
                            <button onclick="showDashboard()" class="flex-1 bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546] font-semibold py-3 rounded-xl transition">← Back</button>
                            <button onclick="startWaecPractice()" class="flex-[2] bg-amber-400 hover:bg-amber-300 text-slate-950 font-semibold py-3 rounded-xl transition">Start practice</button>
                        </div>
                    </div>
                </div>`;
        }

        function startWaecPractice() {
            if (!hasPracticeAccess()) { alert('Your 1-month free trial has ended. Get the 1-year plan to continue.'); showDashboard(); return; }
            const ws = state.wpsetup;
            const sub = ws.subject;
            const raw = sub === 'english' ? buildPracticeEnglish(WAEC_PRACTICE_QS, true) : getWaecQuestions(sub, WAEC_PRACTICE_QS);
            const items = raw.filter(q => !q.novel).map(q => ({ ...q, subject: sub }));
            if (!items.length) { alert('No questions are available for this subject yet.'); return; }
            const secs = items.length * WAEC_PRACTICE_SECS_PER_Q;
            state.practice = { style: 'waec', subjects: [sub], items, index: 0, answers: {}, secs, timeLeft: secs, deadline: Date.now() + secs * 1000, timedOut: false };
            setView('practice');
            window.scrollTo(0, 0);
            startPracticeTimer();
        }

        // --- WAEC/NECO/GCE MODE: one subject, 60 questions, timed, exam-style (no answers shown until the end) ---
        const WAEC_QS = 60;
        const WAEC_MINUTES = 60;
        const WAEC_NEEDS_PASS = true;   // set to false to make WAEC/NECO/GCE mode free (the Firestore rules must then allow mode 'waec')
        let waecInterval = null;

        function hasWaecAccess() { return !WAEC_NEEDS_PASS || hasFullAccess(); }

        function waecGrade(pct) {
            if (pct >= 75) return { code: 'A1', label: 'Excellent' };
            if (pct >= 70) return { code: 'B2', label: 'Very good' };
            if (pct >= 65) return { code: 'B3', label: 'Good' };
            if (pct >= 60) return { code: 'C4', label: 'Credit' };
            if (pct >= 55) return { code: 'C5', label: 'Credit' };
            if (pct >= 50) return { code: 'C6', label: 'Credit' };
            if (pct >= 45) return { code: 'D7', label: 'Pass' };
            if (pct >= 40) return { code: 'E8', label: 'Pass' };
            return { code: 'F9', label: 'Fail' };
        }

        function waecAccessHtml() {
            const P = state.pass;
            if (hasWaecAccess()) return `<button onclick="openWaecSetup()" class="mt-4 bg-[#f4b731] hover:bg-[#ffc844] text-[#0b3d2b] font-semibold text-sm rounded-xl px-5 py-3 transition self-start">📝 Start a WAEC/NECO/GCE paper</button>`;
            if (P === null) return `<p class="mt-5 text-sm text-white/70">Checking your pass…</p>`;
            return `<div class="mt-4 bg-white/10 rounded-xl p-3 text-sm leading-relaxed">🔒 Your 1-month free trial has ended. Get the 1-year plan${priceParen()} to unlock WAEC/NECO/GCE mode. The same pass also unlocks the full JAMB exam.</div>
                <div class="flex flex-wrap gap-2 mt-3">
                    <button onclick="goPay()" class="bg-[#f4b731] hover:bg-[#ffc844] text-[#0b3d2b] font-semibold text-sm rounded-xl px-5 py-3 transition">Activate 1-year plan</button>
                    <button onclick="refreshPass()" class="border border-white/30 hover:bg-white/10 font-semibold text-sm rounded-xl px-4 py-3 transition">${IS_PLAY_APP ? 'Check again' : 'I have paid, check again'}</button>
                </div>`;
        }

        function openWaecSetup() {
            if (!hasWaecAccess()) { alert('Your free trial has ended. Get the 1-year plan to use WAEC/NECO/GCE mode.'); return; }
            setView('waecSetup');
            window.scrollTo(0, 0);
        }
        function pickWaecSubject(sub) { state.wsetup.subject = sub; render(); }

        function renderWaecSetup() {
            const sel = state.wsetup.subject;
            const subs = ['english', ...OTHER_SUBJECTS];
            const n = sel === 'english' ? englishExamSize(true) : Math.min(WAEC_QS, availableFor(sel, true));
            const mins = Math.max(1, Math.round(n * (WAEC_MINUTES / WAEC_QS)));
            const btn = sub => {
                const on = sel === sub;
                return `<button onclick="pickWaecSubject('${sub}')" class="text-left p-3 rounded-xl border text-sm font-semibold transition ${on ? 'bg-[#e1f3e8] border-[#066c43] text-[#0b3d2b]' : 'bg-[#faf8f2] border-[#e8e2d2] text-[#2f5546] hover:border-[#0b5a3c]'}">
                    <span class="flex items-center justify-between gap-2">
                        <span>${esc(subjLabel(sub))}</span>
                        <span class="w-5 h-5 shrink-0 rounded-full border flex items-center justify-center text-[11px] ${on ? 'bg-[#066c43] border-[#066c43] text-white' : 'border-[#c9c3ad] text-transparent'}">✓</span>
                    </span>
                    ${hasWaecQuestions(sub) ? '' : '<span class="block text-[10px] font-medium text-[#8a6500] mt-1">Sample questions</span>'}
                </button>`;
            };
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2] text-[#0b3d2b]">
                    <div class="max-w-xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-6 sm:p-8 shadow-xl">
                        <span class="bg-[#e1f3e8] text-[#0b5a3c] text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-[#bfe0cd]">WAEC/NECO/GCE mode</span>
                        <h2 class="text-2xl font-bold mt-3">Choose one subject</h2>
                        <p class="text-[#58796b] text-sm mt-1 leading-relaxed">One paper at a time, timed. Answers are shown only after you submit.</p>
                        <div class="grid grid-cols-2 gap-2 mt-5">${subs.map(btn).join('')}</div>
                        ${n < WAEC_QS ? `<p class="text-xs text-amber-800 mt-3">Only ${n} ${esc(subjLabel(sel))} questions are available right now, so this paper will have ${n}.</p>` : ''}
                        <div class="mt-5 text-sm bg-[#faf8f2] border border-[#e8e2d2] rounded-xl p-3 leading-relaxed">
                            ⏱️ <strong>${n} questions</strong> · <strong>${mins} minutes</strong>. The paper submits by itself when time is up.
                        </div>
                        <div class="flex gap-3 mt-8">
                            <button onclick="showDashboard()" class="flex-1 bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546] font-semibold py-3 rounded-xl transition">← Back</button>
                            <button onclick="startWaec()" class="flex-[2] bg-[#066c43] hover:bg-[#055a37] text-white font-semibold py-3 rounded-xl transition">Begin paper 🚀</button>
                        </div>
                    </div>
                </div>`;
        }

        async function startWaec() {
            if (!hasWaecAccess()) { alert('Your free trial has ended. Get the 1-year plan to use WAEC/NECO/GCE mode.'); showDashboard(); return; }
            const sub = state.wsetup.subject;
            const raw = sub === 'english' ? buildEnglishExam(true) : getWaecQuestions(sub, WAEC_QS);
            const items = raw.filter(q => !q.novel).map(q => ({ ...q, subject: sub }));
            if (!items.length) { alert('No questions are available for this subject yet.'); return; }
            const secs = Math.round(items.length * (WAEC_MINUTES * 60 / WAEC_QS));
            const W = state.waec = { subject: sub, items, index: 0, answers: {}, flagged: {}, secs, timeLeft: secs, offset: 0, deadline: Date.now() + secs * 1000, sessionId: null, timedOut: false, saveError: false };
            try {
                const ref = await addDoc(collection(db, 'sessions'), {
                    uid: state.user.uid, name: state.user.name, regNumber: state.user.regNumber || '',
                    subjects: [sub], mode: 'waec', status: 'In progress',
                    startedAt: serverTimestamp()
                });
                W.sessionId = ref.id;
                try {
                    const snap = await getDoc(ref);
                    const t = snap.data() && snap.data().startedAt;
                    if (t && t.toMillis) { W.offset = t.toMillis() - Date.now(); W.deadline = t.toMillis() + secs * 1000; }
                } catch (_) {}
            } catch (err) {
                console.error('Could not log WAEC/NECO/GCE session start', err);
                if (err && err.code === 'permission-denied') {
                    state.pass = { expiresMs: 0, active: false, error: false };
                    alert('Your free trial or pass is not active, so the paper cannot start.');
                    state.waec = null;
                    showDashboard();
                    return;
                }
            }
            setView('waec');
            window.scrollTo(0, 0);
            startWaecTimer();
        }

        function updateWaecTimer() {
            const el = document.getElementById('waec-timer');
            if (!el || !state.waec) return;
            el.textContent = formatClock(state.waec.timeLeft);
            if (state.waec.timeLeft < 300) el.classList.add('text-rose-600', 'animate-pulse');
        }

        function startWaecTimer() {
            if (waecInterval) clearInterval(waecInterval);
            const W = state.waec;
            const tick = () => {
                if (state.waec !== W || state.currentView !== 'waec') { clearInterval(waecInterval); waecInterval = null; return; }
                W.timeLeft = Math.max(0, Math.round((W.deadline - (Date.now() + W.offset)) / 1000));
                updateWaecTimer();
                if (W.timeLeft <= 0) {
                    clearInterval(waecInterval); waecInterval = null;
                    W.timedOut = true;
                    alert('Time is up! Submitting your paper now.');
                    submitWaec();
                }
            };
            waecInterval = setInterval(tick, 1000);
            tick();
        }

        function waecSelect(i) { state.waec.answers[state.waec.index] = i; render(); }
        function waecFlag() { const W = state.waec; W.flagged[W.index] = !W.flagged[W.index]; render(); }
        function waecNext() { const W = state.waec; if (W.index < W.items.length - 1) { W.index++; render(); window.scrollTo(0, 0); } }
        function waecPrev() { const W = state.waec; if (W.index > 0) { W.index--; render(); window.scrollTo(0, 0); } }
        function waecJump(i) { state.waec.index = i; render(); window.scrollTo(0, 0); }
        function waecConfirmSubmit() {
            const W = state.waec;
            const left = W.items.length - Object.keys(W.answers).length;
            if (confirm(left ? 'You have ' + left + ' unanswered question' + (left === 1 ? '' : 's') + '. Submit your paper now?' : 'Submit your paper now?')) submitWaec();
        }
        function waecQuit() {
            if (confirm('Leave this paper? Your answers will not be scored.')) {
                if (waecInterval) { clearInterval(waecInterval); waecInterval = null; }
                state.waec = null;
                clearProgress();
                showDashboard();
            }
        }

        function waecReviewItems() {
            const W = state.waec;
            return W.items.map((q, i) => ({ s: q.subject, q: q.question, o: q.options, a: q.answer, c: W.answers[i] === undefined ? -1 : W.answers[i], p: q.passage || null, n: q.novel ? 1 : 0 }));
        }

        async function submitWaec() {
            if (state.currentView !== 'waec') return;
            if (waecInterval) { clearInterval(waecInterval); waecInterval = null; }
            clearProgress();
            const W = state.waec;
            let right = 0;
            W.items.forEach((q, i) => { if (W.answers[i] === q.answer) right++; });
            W.right = right;
            W.total = W.items.length;
            W.percent = Math.round(right / W.total * 100);
            W.grade = waecGrade(W.percent);
            setView('waecResult');
            window.scrollTo(0, 0);
            if (!W.sessionId) { W.saveError = true; render(); return; }
            try {
                await updateDoc(doc(db, 'sessions', W.sessionId), {
                    status: 'Completed', rawScore: right, totalQuestions: W.total,
                    percent: W.percent, grade: W.grade.code, submittedAt: serverTimestamp()
                });
                await setDoc(doc(db, 'reviews', W.sessionId), { uid: state.user.uid, items: waecReviewItems() });
                state.history = null;
            } catch (err) {
                console.error('Could not save WAEC/NECO/GCE result', err);
                W.saveError = true;
                if (state.currentView === 'waecResult') render();
            }
        }

        function startWaecReview() {
            state.review = { items: waecReviewItems(), tab: 'all', back: 'waecResult', sid: state.waec && state.waec.sessionId };
            setView('review');
            window.scrollTo(0, 0);
        }

        function renderWaec() {
            const W = state.waec;
            const q = W.items[W.index];
            const total = W.items.length;
            const sel = W.answers[W.index];
            const flagged = W.flagged[W.index];
            const answered = Object.keys(W.answers).length;
            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2]">
                    <header class="sticky top-0 z-30 bg-white border-b border-[#e8e2d2] px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <h2 class="font-bold text-[#0b3d2b] tracking-wide">WAEC/NECO/GCE · ${esc(subjLabel(W.subject))}</h2>
                            <p class="text-xs text-[#58796b] truncate">Candidate: <span class="text-[#0b5a3c] font-medium">${esc(state.user.name)}</span></p>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <div class="bg-[#faf8f2] px-3 py-2 rounded-xl border border-[#e8e2d2] flex items-center gap-2">
                                <span class="text-xs text-[#58796b] font-semibold uppercase">Time:</span>
                                <span id="waec-timer" class="font-mono text-emerald-700 font-bold text-lg">${formatClock(W.timeLeft)}</span>
                            </div>
                            <button onclick="waecConfirmSubmit()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition">Submit</button>
                        </div>
                    </header>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 items-start max-w-7xl mx-auto w-full p-4 sm:p-6 gap-4 sm:gap-6">
                        <div class="lg:col-span-3 bg-white border border-[#e8e2d2] rounded-2xl p-4 sm:p-6 lg:p-8 shadow-xl">
                            <div class="flex items-center justify-between mb-6">
                                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-[#e1f3e8] text-[#0b5a3c] border border-[#bfe0cd] uppercase">Question ${W.index + 1} of ${total}</span>
                                <button onclick="waecFlag()" class="text-xs font-semibold px-3 py-1 rounded-full border transition ${flagged ? 'bg-amber-500/20 text-amber-700 border-amber-500/40' : 'bg-[#eef1ec] text-[#58796b] border-[#d9d4c3] hover:text-[#0b3d2b]'}">${flagged ? '🚩 Flagged' : '🏳️ Flag for review'}</button>
                            </div>
                            ${q.passage ? `<div class="mb-5 p-4 rounded-xl bg-[#faf8f2] border border-[#e8e2d2] text-sm text-[#2f5546] leading-relaxed max-h-64 overflow-y-auto"><p class="text-xs font-semibold text-[#0b5a3c] uppercase mb-2">Read the passage and answer the question</p>${esc(q.passage)}</div>` : ''}
                            ${novelTag(q)}<h3 class="text-lg sm:text-xl font-medium text-[#0b3d2b] mb-6 leading-relaxed">${fq(q.question, q.subject)}</h3>
                            <div class="space-y-3">
                                ${q.options.map((opt, idx) => `
                                    <label onclick="waecSelect(${idx})" class="flex items-center gap-4 p-4 rounded-xl border cursor-pointer transition ${sel === idx ? 'bg-[#e1f3e8] border-[#0b5a3c] text-[#0b3d2b]' : 'bg-[#faf8f2] border-[#e8e2d2] text-[#2f5546] hover:border-[#0b5a3c]'}">
                                        <span class="w-7 h-7 shrink-0 rounded-lg flex items-center justify-center font-bold text-xs ${sel === idx ? 'bg-indigo-600 text-white' : 'bg-white text-[#58796b] border border-[#e8e2d2]'}">${String.fromCharCode(65 + idx)}</span>
                                        <span class="text-sm font-medium">${fq(opt, q.subject)}</span>
                                    </label>`).join('')}
                            </div>
                            <div class="flex items-center justify-between pt-6 mt-6 border-t border-[#e8e2d2]">
                                <button onclick="waecPrev()" ${W.index === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-[#eef1ec] text-[#2f5546] font-semibold text-xs hover:bg-[#e1e7e0] disabled:opacity-40 disabled:cursor-not-allowed transition">← Previous</button>
                                <button onclick="waecNext()" ${W.index === total - 1 ? 'disabled' : ''} class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs disabled:opacity-40 disabled:cursor-not-allowed transition">Next →</button>
                            </div>
                        </div>

                        <div class="bg-white border border-[#e8e2d2] rounded-2xl p-4 sm:p-6 shadow-xl lg:sticky lg:top-24">
                            <h4 class="font-bold text-[#0b3d2b] text-sm mb-2 uppercase tracking-wide">Palette</h4>
                            <p class="text-xs text-[#58796b] mb-4">Tap any number to jump</p>
                            <div class="grid grid-cols-8 sm:grid-cols-10 lg:grid-cols-5 gap-1.5 mb-6">
                                ${W.items.map((_, idx) => {
                                    let cls = 'bg-[#faf8f2] text-[#58796b] border-[#e8e2d2]';
                                    if (W.answers[idx] !== undefined) cls = 'bg-[#cfeadb] text-[#0b5a3c] border-[#0b5a3c]';
                                    if (W.index === idx) cls = 'border-2 border-[#0b5a3c] text-[#0b3d2b] bg-[#e1f3e8]';
                                    if (W.flagged[idx]) cls = 'bg-amber-500/20 text-amber-800 border-amber-500/50';
                                    return `<button onclick="waecJump(${idx})" class="h-9 rounded-lg font-bold text-xs border transition ${cls}">${idx + 1}</button>`;
                                }).join('')}
                            </div>
                            <div class="space-y-2 text-xs text-[#58796b] pt-4 border-t border-[#e8e2d2]">
                                <div class="flex justify-between"><span>Answered:</span><span class="font-bold text-emerald-700">${answered} / ${total}</span></div>
                                <div class="flex justify-between"><span>Unanswered:</span><span class="font-bold text-[#2f5546]">${total - answered}</span></div>
                            </div>
                            <button onclick="waecQuit()" class="mt-4 text-xs text-[#58796b] hover:text-[#0b3d2b] font-semibold">✕ Leave paper</button>
                        </div>
                    </div>
                </div>`;
        }

        function renderWaecResult() {
            const W = state.waec;
            const g = W.grade;
            const msg = W.timedOut ? 'Time ran out. Unanswered questions count as wrong. ⏱️' : (W.percent >= 50 ? 'Well done! That is a credit level score. 🌟' : 'Keep practising. Go through your answers to see where you lost marks. 📚');
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2]">
                    <div class="max-w-xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-8 shadow-xl text-center">
                        <span class="bg-[#e1f3e8] text-[#0b5a3c] text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-[#bfe0cd]">WAEC/NECO/GCE · ${esc(subjLabel(W.subject))}</span>
                        <p class="text-6xl font-extrabold text-emerald-700 mt-5">${W.right}<span class="text-2xl text-[#7a9588]"> / ${W.total}</span></p>
                        <p class="text-[#2f5546] mt-1">${W.percent}% correct</p>
                        <div class="inline-block mt-4 px-5 py-2 rounded-xl bg-[#e1f3e8] border border-[#bfe0cd]">
                            <p class="font-display font-extrabold text-2xl text-[#066c43]">${esc(g.code)}</p>
                            <p class="text-xs text-[#0b5a3c] font-semibold">${esc(g.label)}</p>
                        </div>
                        <p class="text-sm text-[#58796b] mt-4">${msg}</p>
                        <p class="text-[11px] text-[#7a9588] mt-2">The grade follows the usual WAEC/NECO/GCE bands, but this is practice, so your real result may differ.</p>
                        ${W.saveError ? `<p class="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-3 mt-4">We could not save this result, so it will not show on your dashboard. Your score above is still correct.</p>` : ''}
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8">
                            <button onclick="startWaecReview()" class="bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#0b3d2b] font-semibold py-3 rounded-xl transition">Review answers</button>
                            <button onclick="openWaecSetup()" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-semibold py-3 rounded-xl transition">Another paper</button>
                            <button onclick="showDashboard()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">Dashboard</button>
                        </div>
                    </div>
                </div>`;
        }

        async function openAdmin() {
            if (!state.isAdmin) return;
            try {
                const [uSnap, sSnap, pSnap] = await Promise.all([
                    getDocs(collection(db, 'users')),
                    getDocs(query(collection(db, 'sessions'), orderBy('startedAt', 'desc'), limit(100))),
                    getDocs(collection(db, 'passes')).catch(() => ({ docs: [], failed: true }))
                ]);
                state.adminData.passes = {};
                pSnap.docs.forEach(d => { const e = d.data().expiresAt; state.adminData.passes[d.id] = e && e.toMillis ? e.toMillis() : 0; });
                state.adminData.passesFailed = !!pSnap.failed;
                state.adminData.users = uSnap.docs.map(d => ({ uid: d.id, ...d.data() }));
                state.adminData.sessions = sSnap.docs.map(d => d.data());
                setView('admin');
            } catch (err) { alert(friendlyError(err)); }
        }

        function fmtTime(ts) { return ts && ts.toDate ? ts.toDate().toLocaleString() : '—'; }
        function regMs(u) { return u && u.createdAt && u.createdAt.toMillis ? u.createdAt.toMillis() : 0; }

        function adminStudentsHtml() {
            const { users, passes } = state.adminData;
            const f = (state.adminFilter || '').trim().toLowerCase();
            const list = users.filter(u => !f || [u.name, u.email, u.regNumber].some(v => String(v || '').toLowerCase().includes(f))).sort((a, b) => regMs(b) - regMs(a));
            if (!list.length) return '<p class="text-sm text-[#0b3d2b]/60">No students match.</p>';
            const shown = list.slice(0, 60);
            return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                ${shown.map(u => {
                    const ms = (passes && passes[u.uid]) || 0;
                    const active = ms > Date.now();
                    return `<div class="bg-[#faf8f2] p-4 rounded-xl border border-[#e8e2d2]">
                        <p class="font-semibold text-sm">${esc(u.name)}</p>
                        <p class="text-xs text-[#0b5a3c] break-all mt-0.5">${esc(u.email)}</p>
                        ${u.regNumber ? `<p class="text-xs text-[#0b3d2b]/60 mt-1">Reg: ${esc(u.regNumber)}</p>` : ''}
                        <p class="text-xs text-[#0b3d2b]/60 mt-1">Registered: ${regMs(u) ? esc(new Date(regMs(u)).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' })) + ', ' + esc(new Date(regMs(u)).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })) : '—'}</p>
                        <p class="text-xs font-semibold mt-2 ${active ? 'text-[#0b5a3c]' : 'text-[#8a6500]'}">${active ? '✓ Pass until ' + esc(fmtDate(ms)) : (ms ? 'Pass expired ' + esc(fmtDate(ms)) : 'No pass')}</p>
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <button onclick="grantPass('${esc(u.uid)}', ${PLAN_DAYS})" class="text-[11px] font-semibold bg-[#066c43] hover:bg-[#055a37] text-white rounded-lg px-2.5 py-1.5">+1 year</button>
                            ${ms ? `<button onclick="removePass('${esc(u.uid)}')" class="text-[11px] font-semibold text-rose-700 border border-rose-200 hover:bg-rose-50 rounded-lg px-2.5 py-1.5">Remove</button>` : ''}
                        </div>
                    </div>`;
                }).join('')}
            </div>${list.length > shown.length ? `<p class="text-xs text-[#0b3d2b]/60 mt-3">Showing the first ${shown.length} of ${list.length}. Use the search box to find a student.</p>` : ''}`;
        }

        function setAdminFilter(v) {
            state.adminFilter = v;
            const el = document.getElementById('admin-students');
            if (el) el.innerHTML = adminStudentsHtml();
        }

        async function grantPass(uid, days) {
            const u = state.adminData.users.find(x => x.uid === uid);
            if (!u) return;
            const base = Math.max(Date.now(), state.adminData.passes[uid] || 0);
            const exp = base + days * 86400000;
            if (!confirm('Give ' + u.name + ' ' + (days === PLAN_DAYS ? '1 year' : days + ' more days') + '? The pass will run until ' + fmtDate(exp) + '.')) return;
            try {
                await setDoc(doc(db, 'passes', uid), {
                    uid, name: u.name || '', regNumber: u.regNumber || '', days,
                    grantedAt: serverTimestamp(), expiresAt: Timestamp.fromMillis(exp)
                });
                state.adminData.passes[uid] = exp;
                setAdminFilter(state.adminFilter);
            } catch (err) { alert(friendlyError(err)); }
        }

        async function removePass(uid) {
            const u = state.adminData.users.find(x => x.uid === uid);
            if (!u || !confirm('Remove the pass for ' + u.name + '?')) return;
            try {
                await deleteDoc(doc(db, 'passes', uid));
                delete state.adminData.passes[uid];
                setAdminFilter(state.adminFilter);
            } catch (err) { alert(friendlyError(err)); }
        }

        function renderAdmin() {
            const { users, sessions } = state.adminData;
            const card = 'bg-white border border-[#e8e2d2] rounded-2xl';
            const badge = x => x.status === 'Completed'
                ? 'bg-[#e1f3e8] text-[#0b5a3c] border border-[#bfe0cd]'
                : (x.mode === 'practice' ? 'bg-[#f6ecc9] text-[#8a6500] border border-[#ecdca4]' : 'bg-[#eef1ec] text-[#58796b] border border-[#e8e2d2]');
            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2] text-[#0b3d2b]">
                    <header class="sticky top-0 z-20 bg-white border-b border-[#e8e2d2]">
                        <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg bg-[#066c43] text-white flex items-center justify-center text-sm">🎓</div>
                                <div class="leading-tight">
                                    <p class="font-display font-bold text-xs">GENIUS CBT</p>
                                    <p class="text-[9px] font-semibold tracking-[0.2em] text-[#b88700]">ADMIN</p>
                                </div>
                            </div>
                            <button onclick="showDashboard()" class="text-xs font-medium px-3 py-1.5 rounded-lg text-[#0b3d2b]/70 hover:bg-[#f1ede0]">← Dashboard</button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6">
                        <span class="text-[10px] font-semibold tracking-wider text-[#8a6500] bg-[#f6ecc9] rounded-full px-3 py-1">ADMIN PORTAL</span>
                        <h1 class="font-display font-extrabold text-2xl sm:text-3xl mt-3">Candidate activity & accounts</h1>

                        ${adminInboxCard()}

                        <div class="${card} p-5 mt-6">
                            <h2 class="font-display font-bold text-lg">Students and passes (${users.length})</h2>
                            <p class="text-xs text-[#0b3d2b]/60 mt-1 mb-3">Newest sign-ups are listed first. Everything needs an active pass once the 30-day trial is over. After a student pays you, tap +1 year on their card.${state.adminData.passesFailed ? ' <span class="text-rose-700 font-semibold">Passes could not load. Publish the new Firestore rules first.</span>' : ''}</p>
                            <input type="search" value="${esc(state.adminFilter)}" oninput="setAdminFilter(this.value)" placeholder="Search by name, email or reg number" class="${inputCls} mb-4">
                            <div id="admin-students">${adminStudentsHtml()}</div>
                        </div>

                        <div class="${card} p-5 mt-6 overflow-hidden">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="font-display font-bold text-lg">Recent sessions</h2>
                                <button onclick="openAdmin()" class="text-xs font-semibold text-[#0b5a3c] hover:underline">↻ Refresh</button>
                            </div>
                            ${sessions.length === 0 ? '<p class="text-center py-10 text-sm text-[#0b3d2b]/60">No sessions yet.</p>' : `
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse min-w-[640px]">
                                        <thead>
                                            <tr class="border-b border-[#e8e2d2] text-[#0b3d2b]/60 text-xs uppercase">
                                                <th class="py-3 px-3 font-semibold">Candidate</th><th class="py-3 px-3 font-semibold">Reg No.</th>
                                                <th class="py-3 px-3 font-semibold">Subjects</th><th class="py-3 px-3 font-semibold">Started</th>
                                                <th class="py-3 px-3 font-semibold">Score</th><th class="py-3 px-3 font-semibold">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-[#efe9d9] text-sm">
                                            ${sessions.map(x => `
                                                <tr>
                                                    <td class="py-3 px-3 font-semibold">${esc(x.name)}</td>
                                                    <td class="py-3 px-3 text-[#0b5a3c]">${esc(x.regNumber)}</td>
                                                    <td class="py-3 px-3 text-xs uppercase text-[#0b3d2b]/70">${esc((x.subjects || []).join(', '))}</td>
                                                    <td class="py-3 px-3 text-[#0b3d2b]/60 text-xs">${esc(fmtTime(x.startedAt))}</td>
                                                    <td class="py-3 px-3 font-semibold">${(x.mode === 'practice' || x.mode === 'waec') ? esc(x.rawScore !== undefined ? x.rawScore : '—') + ' / ' + esc(x.totalQuestions !== undefined ? x.totalQuestions : '—') : (x.scaledScore !== undefined ? esc(x.scaledScore) + ' / 400' : '—')}</td>
                                                    <td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badge(x)}">${esc(x.mode === 'practice' ? 'Practice' : (x.mode === 'waec' ? 'WAEC/NECO/GCE' + (x.grade ? ' ' + x.grade : '') : (x.status || '—')))}</span></td>
                                                </tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>`}
                        </div>
                    </main>
                </div>`;
        }

        // --- EMAIL LINKS (verify email / reset password) handled on our own address ---
        function clearActionUrl() { try { history.replaceState(null, '', location.pathname); } catch (_) {} }

        async function runAction() {
            const A = state.action;
            try {
                if (A.mode === 'verifyEmail') {
                    await applyActionCode(auth, A.code);
                    A.status = 'done';
                    A.msg = 'Your email has been verified. You can now sign in.';
                    clearActionUrl();
                } else if (A.mode === 'resetPassword') {
                    A.email = await verifyPasswordResetCode(auth, A.code);
                    A.status = 'form';
                } else {
                    A.status = 'error';
                    A.msg = 'This link is not supported.';
                }
            } catch (err) {
                console.error(err);
                A.status = 'error';
                A.msg = A.mode === 'verifyEmail'
                    ? 'This link has expired or was already used. If you already verified, just sign in. If not, try signing in and we will send you a new link.'
                    : 'This reset link has expired or was already used. Go to sign in and tap Forgot password to get a new one.';
            }
            if (state.currentView === 'action') render();
        }

        async function handleNewPassword(e) {
            e.preventDefault();
            const A = state.action;
            const pw = document.getElementById('newPassword').value;
            if (pw !== document.getElementById('newPassword2').value) { document.getElementById('newpw-error').textContent = 'The two passwords do not match.'; return; }
            const btn = document.getElementById('newpw-btn');
            const errEl = document.getElementById('newpw-error');
            errEl.textContent = '';
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                await confirmPasswordReset(auth, A.code, pw);
                A.status = 'done';
                A.msg = 'Your password has been changed. Sign in with your new password.';
                clearActionUrl();
                render();
            } catch (err) {
                errEl.textContent = friendlyError(err);
                btn.disabled = false; btn.textContent = 'Save new password';
            }
        }

        function goToLogin() { clearActionUrl(); state.action = null; setView('login'); }

        function renderAction() {
            const A = state.action || { status: 'error', msg: 'Something went wrong.' };
            let body;
            if (A.status === 'working') {
                body = `<h1 class="font-display font-bold text-xl mt-1">${A.mode === 'resetPassword' ? 'Checking your link…' : 'Verifying your email…'}</h1><p class="text-sm text-[#0b3d2b]/60 mt-3">Please wait a moment.</p>`;
            } else if (A.status === 'form') {
                body = `<h1 class="font-display font-bold text-xl mt-1">Choose a new password</h1>
                    <p class="text-xs text-[#0b3d2b]/60 mt-1 break-all">For ${esc(A.email || '')}</p>
                    <form onsubmit="handleNewPassword(event)" class="mt-5 space-y-4">
                        <div>
                            <label for="newPassword" class="block text-xs font-medium mb-1.5">New password</label>
                            <div class="relative"><input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" class="${inputCls} pr-16"><button type="button" onclick="togglePw('newPassword', this)" tabindex="-1" aria-label="Show or hide password" class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-[#0b5a3c]">Show</button></div>
                        </div>
                        <div>
                                    <label for="newPassword2" class="block text-xs font-medium mb-1.5">Confirm new password</label>
                                    <div class="relative"><input type="password" id="newPassword2" required minlength="6" placeholder="Type it again" autocomplete="new-password" class="${inputCls} pr-16"><button type="button" onclick="togglePw('newPassword2', this)" tabindex="-1" aria-label="Show or hide password" class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-[#0b5a3c]">Show</button></div>
                                </div>
                                <p id="newpw-error" class="text-xs text-red-600 min-h-[1rem]"></p>
                        <button type="submit" id="newpw-btn" class="w-full bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm py-2.5 rounded-lg transition">Save new password</button>
                    </form>`;
            } else if (A.status === 'done') {
                body = `<div class="text-3xl">✅</div><h1 class="font-display font-bold text-xl mt-2">Done</h1>
                    <p class="text-sm text-[#0b3d2b]/70 mt-2 leading-relaxed">${esc(A.msg)}</p>
                    <button onclick="goToLogin()" class="w-full mt-5 bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm py-2.5 rounded-lg transition">Go to sign in</button>`;
            } else {
                body = `<div class="text-3xl">⚠️</div><h1 class="font-display font-bold text-xl mt-2">Link problem</h1>
                    <p class="text-sm text-[#0b3d2b]/70 mt-2 leading-relaxed">${esc(A.msg)}</p>
                    <button onclick="goToLogin()" class="w-full mt-5 bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm py-2.5 rounded-lg transition">Go to sign in</button>`;
            }
            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2] text-[#0b3d2b]">
                    <header class="bg-gradient-to-b from-[#0b6b45] to-[#00170f] px-4 sm:px-8 py-3">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-[#f4b731] text-[#0b3d2b] flex items-center justify-center">🎓</div>
                            <div class="leading-tight text-white">
                                <p class="font-display font-bold text-xs tracking-wide">GENIUS CBT</p>
                                <p class="text-[9px] font-semibold tracking-[0.2em] text-[#f4b731]">UTME · WAEC · NECO · GCE</p>
                            </div>
                        </div>
                    </header>
                    <main class="flex-1 px-4 pt-8 sm:pt-16 pb-10">
                        <div class="max-w-sm sm:max-w-md mx-auto bg-white border border-[#e8e2d2] rounded-2xl p-6 sm:p-8 shadow-sm">${body}</div>
                    </main>
                </div>`;
        }

        // --- AUTO SIGN-OUT: students must sign in again after being away for 3 minutes ---
        const AWAY_LIMIT_MS = 3 * 60 * 1000;
        const AWAY_NOTICE = 'You were signed out because you were away for more than 3 minutes. Please sign in again.';
        let memActive = 0;
        function touchActive() {
            memActive = Date.now();
            try { localStorage.setItem('gt_last_active', String(memActive)); } catch (_) {}
        }
        function lastActive() {
            try { const v = Number(localStorage.getItem('gt_last_active')); if (v) return v; } catch (_) {}
            return memActive;
        }
        function awayTooLong() {
            const t = lastActive();
            return !!t && (Date.now() - t) > AWAY_LIMIT_MS;
        }
        async function forceLogout(msg) {
            try { await signOut(auth); } catch (_) {}
            if (practiceInterval) { clearInterval(practiceInterval); practiceInterval = null; }
            stopMessaging(); state.user = null; state.isAdmin = false; state.history = null; state.leaderboard = null; state.pass = null;
            setView('login', msg);
        }
        function checkAway() {
            if (!state.user) return;
            // never log someone out in the middle of an exam or practice, it would lose their work
            if (['exam', 'practice', 'result', 'waec', 'waecResult'].includes(state.currentView)) { touchActive(); return; }
            if (awayTooLong()) forceLogout(AWAY_NOTICE);
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') touchActive(); else checkAway();
        });
        window.addEventListener('pagehide', touchActive);
        window.addEventListener('focus', checkAway);
        setInterval(() => { if (document.visibilityState === 'visible') touchActive(); }, 15000);

        // --- QUESTION CHAT: students message the admin about a question in Answer review ---
        // threads/{uid_sessionId_questionIndex}  (+ messages subcollection). Admin gets a live badge, toast, beep and
        // (if allowed) a browser notification while the app is open. WhatsApp is the fallback.
        let msgUnsubs = [];
        let adminFirstSnap = true;
        state.inbox = { threads: [], open: null, msgs: [], unsub: null };
        state.myThreads = {};
        state.chat = null;

        // PHONE PUSH for the admin: the server (api/notify.js) sends a notification through ntfy, even when the app is closed.
        // The secret ntfy topic lives only in the Vercel environment variable NTFY_TOPIC, never in this page.
        async function pushAdminAlert(tid) {
            if (state.isAdmin || !auth.currentUser) return;
            try {
                const token = await auth.currentUser.getIdToken();
                fetch('/api/notify', {
                    method: 'POST', keepalive: true,
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ tid })
                }).catch(() => {});
            } catch (_) {}
        }

        function showToast(text, onClick) {
            let box = document.getElementById('gt-toast-box');
            if (!box) {
                box = document.createElement('div');
                box.id = 'gt-toast-box';
                box.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] w-[92%] max-w-sm space-y-2';
                document.body.appendChild(box);
            }
            const el = document.createElement('div');
            el.className = 'bg-[#0b3d2b] text-white text-sm rounded-xl px-4 py-3 shadow-lg cursor-pointer leading-snug';
            el.textContent = text;
            el.onclick = () => { el.remove(); if (onClick) onClick(); };
            box.appendChild(el);
            setTimeout(() => el.remove(), 9000);
        }

        function beep() {
            try {
                const C = window.AudioContext || window.webkitAudioContext;
                const ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = 880; g.gain.value = 0.08;
                o.start(); o.stop(ctx.currentTime + 0.18);
                setTimeout(() => { try { ctx.close(); } catch (_) {} }, 400);
            } catch (_) {}
        }

        function fmtChatTime(ts) {
            return ts && ts.toDate ? ts.toDate().toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'sending…';
        }

        // me = 'student' or 'admin' (whose side is shown on the right in green)
        function chatMsgsHtml(msgs, me, studentName) {
            if (!msgs.length) return '<p class="text-xs text-[#0b3d2b]/55 text-center py-3">No messages yet.</p>';
            return msgs.map(m => {
                const mine = m.role === me;
                const who = m.role === 'admin' ? 'Admin' : (me === 'student' ? 'You' : (studentName || 'Student'));
                return `<div class="flex ${mine ? 'justify-end' : 'justify-start'} mb-2">
                    <div class="max-w-[85%] rounded-2xl px-3 py-2 text-sm leading-relaxed ${mine ? 'bg-[#066c43] text-white' : 'bg-[#eef1ec] text-[#0b3d2b]'}">
                        <p class="text-[10px] font-semibold opacity-70 mb-0.5">${esc(who)}</p>
                        <p class="whitespace-pre-wrap break-words">${esc(m.text)}</p>
                        <p class="text-[10px] opacity-60 mt-1">${fmtChatTime(m.createdAt)}</p>
                    </div></div>`;
            }).join('');
        }

        function threadIdFor(idx) {
            const R = state.review;
            return state.user.uid + '_' + String((R && R.sid) || 'nosession').replace(/[^A-Za-z0-9]/g, '') + '_' + idx;
        }

        function qWhatsApp(it) {
            const msg = 'Hello, I need help with a ' + (it.s || '') + ' question on Genius CBT. Name: ' + (state.user ? state.user.name : '') +
                '. Question: ' + String(it.q || '').slice(0, 200);
            return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
        }

        // shown under every question in Answer review
        function qChatHtml(i, idx) {
            if (!state.user || idx < 0) return '';
            const tid = threadIdFor(idx);
            const C = state.chat;
            const t = state.myThreads[tid];
            if (!(C && C.tid === tid)) {
                const dot = t && t.unreadStudent ? '<span class="ml-2 text-[10px] bg-rose-600 text-white rounded-full px-2 py-0.5">New reply</span>' : '';
                return `<button onclick="openQChat(${idx})" class="mt-3 w-full flex items-center justify-center gap-2 text-sm font-semibold text-[#0b5a3c] bg-[#f4f8f6] hover:bg-[#e1f3e8] border border-[#cfe5d8] rounded-xl py-2.5 transition">💬 Need more explanation? Ask the admin${dot}</button>`;
            }
            return `<div class="mt-3 border border-[#cfe5d8] rounded-xl bg-white p-3">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-sm font-bold text-[#0b3d2b]">💬 Ask the admin about this question</p>
                    <button onclick="closeQChat()" class="text-xs font-semibold text-[#58796b] hover:underline">Close</button>
                </div>
                <div id="chat-msgs" class="max-h-64 overflow-y-auto mb-2">${chatMsgsHtml(C.msgs, 'student', '')}</div>
                ${C.error ? `<p class="text-xs text-rose-700 mb-2">${esc(C.error)}</p>` : ''}
                <textarea id="chat-input" rows="2" maxlength="1000" oninput="setChatDraft(this.value)" placeholder="Type what you want explained…" class="w-full bg-white border border-[#d9d4c3] rounded-lg px-3 py-2 text-sm text-[#0b3d2b] focus:outline-none focus:border-[#0b5a3c]">${esc(C.draft)}</textarea>
                <div class="flex items-center gap-2 mt-2">
                    <button id="chat-send" onclick="sendQChat()" class="flex-1 bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm rounded-xl py-2.5 transition">Send</button>
                    <a href="${qWhatsApp(i)}" target="_blank" rel="noopener" class="shrink-0 bg-[#25a244] hover:bg-[#1f8a3a] text-white font-semibold text-sm rounded-xl px-4 py-2.5 transition">WhatsApp</a>
                </div>
                <p class="text-[11px] text-[#0b3d2b]/55 mt-2 leading-relaxed">The admin is notified when you send. If the reply is slow, tap WhatsApp to reach him directly.</p>
            </div>`;
        }

        function setChatDraft(v) { if (state.chat) state.chat.draft = v; }

        function paintChat() {
            const el = document.getElementById('chat-msgs');
            if (!el || !state.chat) return;
            el.innerHTML = chatMsgsHtml(state.chat.msgs, 'student', '');
            el.scrollTop = el.scrollHeight;
        }

        function closeQChat(silent) {
            if (state.chat && state.chat.unsub) { try { state.chat.unsub(); } catch (_) {} }
            state.chat = null;
            if (!silent) render();
        }

        async function openQChat(idx) {
            if (!state.user || !state.review) return;
            closeQChat(true);
            const tid = threadIdFor(idx);
            state.chat = { idx, tid, msgs: [], draft: '', error: '', sending: false, unsub: null };
            render();
            try {
                state.chat.unsub = onSnapshot(
                    query(collection(db, 'threads', tid, 'messages'), orderBy('createdAt', 'asc')),
                    snap => {
                        if (!state.chat || state.chat.tid !== tid) return;
                        state.chat.msgs = snap.docs.map(d => d.data());
                        paintChat();
                    },
                    err => {
                        console.error('chat listen', err);
                        if (state.chat && state.chat.tid === tid) { state.chat.error = 'Messages could not load (' + (err.code || 'error') + ').'; render(); }
                    }
                );
                const ts = await getDoc(doc(db, 'threads', tid));
                if (ts.exists() && ts.data().unreadStudent) await updateDoc(doc(db, 'threads', tid), { unreadStudent: false });
            } catch (e) { console.error(e); }
        }

        async function sendQChat() {
            const C = state.chat;
            if (!C || C.sending) return;
            const inp = document.getElementById('chat-input');
            const text = ((inp ? inp.value : C.draft) || '').trim().slice(0, 1000);
            if (!text) return;
            const it = state.review && state.review.items[C.idx];
            if (!it) return;
            C.sending = true; C.error = '';
            const btn = document.getElementById('chat-send');
            if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
            try {
                const uid = state.user.uid, ref = doc(db, 'threads', C.tid);
                const snap = await getDoc(ref);
                const last = text.slice(0, 200);
                if (!snap.exists()) {
                    const L = k => (k >= 0 ? String.fromCharCode(65 + k) : '-');
                    await setDoc(ref, {
                        uid, studentName: String(state.user.name || 'Student').slice(0, 100),
                        subject: String(it.s || '').slice(0, 80), qText: String(it.q || '').slice(0, 600),
                        optionsText: it.o.map((o, k) => L(k) + '. ' + o).join(' | ').slice(0, 800),
                        correct: L(it.a), chosen: L(it.c),
                        sessionId: String((state.review.sid) || '').slice(0, 60), qIndex: C.idx,
                        lastMessage: last, lastRole: 'student', lastAt: serverTimestamp(), createdAt: serverTimestamp(),
                        unreadAdmin: true, unreadStudent: false
                    });
                } else {
                    await updateDoc(ref, { lastMessage: last, lastRole: 'student', lastAt: serverTimestamp(), unreadAdmin: true, unreadStudent: false });
                }
                await addDoc(collection(db, 'threads', C.tid, 'messages'), { uid, role: 'student', text, createdAt: serverTimestamp() });
                pushAdminAlert(C.tid);
                C.draft = '';
                if (inp) inp.value = '';
            } catch (e) {
                console.error('send chat', e);
                C.error = 'Message not sent (' + (e.code || 'error') + '). Try again, or use WhatsApp.';
                render();
            } finally {
                C.sending = false;
                const b = document.getElementById('chat-send');
                if (b) { b.disabled = false; b.textContent = 'Send'; }
            }
        }

        // ---------- admin side ----------
        function adminUnreadCount() { return state.isAdmin ? state.inbox.threads.filter(t => t.unreadAdmin).length : 0; }

        function adminBadgeHtml() {
            const n = adminUnreadCount();
            return `<span class="admin-msg-badge ml-1.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white text-[10px] font-bold ${n ? '' : 'hidden'}">${n}</span>`;
        }

        function updateAdminBadges() {
            const n = adminUnreadCount();
            document.querySelectorAll('.admin-msg-badge').forEach(el => { el.textContent = n; el.classList.toggle('hidden', !n); });
            const l = document.getElementById('admin-inbox-list');
            if (l) l.innerHTML = adminInboxListHtml();
        }

        function adminInboxListHtml() {
            const T = state.inbox.threads;
            if (!T.length) return '<p class="text-sm text-[#0b3d2b]/60">No student questions yet.</p>';
            return T.slice(0, 40).map(t => `
                <button onclick="openAdminThread('${esc(t.id)}')" class="w-full text-left p-3 rounded-xl border ${t.unreadAdmin ? 'border-rose-300 bg-rose-50' : 'border-[#e8e2d2] bg-[#faf8f2]'} ${state.inbox.open === t.id ? 'ring-2 ring-[#0b5a3c]' : ''} hover:border-[#0b5a3c] transition">
                    <div class="flex items-center justify-between gap-2">
                        <p class="font-semibold text-sm truncate">${t.unreadAdmin ? '● ' : ''}${esc(t.studentName || 'Student')} · <span class="text-[#0b5a3c]">${esc(t.subject || '')}</span></p>
                        <span class="text-[10px] text-[#0b3d2b]/50 shrink-0">${fmtChatTime(t.lastAt)}</span>
                    </div>
                    <p class="text-xs text-[#0b3d2b]/70 mt-0.5 truncate">${t.lastRole === 'admin' ? 'You: ' : ''}${esc(t.lastMessage || '')}</p>
                </button>`).join('');
        }

        function adminChatHtml() {
            const I = state.inbox;
            const t = I.threads.find(x => x.id === I.open);
            if (!I.open || !t) return '';
            return `<div class="mt-4 border border-[#cfe5d8] rounded-xl p-4 bg-[#f4f8f6]">
                <div class="flex items-center justify-between mb-2">
                    <p class="font-bold text-sm">${esc(t.studentName || 'Student')} · ${esc(t.subject || '')}</p>
                    <button onclick="closeAdminThread()" class="text-xs font-semibold text-[#58796b] hover:underline">Close</button>
                </div>
                <div class="text-xs bg-white border border-[#e8e2d2] rounded-lg p-3 mb-3 leading-relaxed">
                    <p class="font-semibold mb-1">Question</p>
                    <p class="whitespace-pre-wrap">${esc(t.qText || '')}</p>
                    <p class="mt-2 text-[#0b3d2b]/70 whitespace-pre-wrap">${esc(t.optionsText || '')}</p>
                    <p class="mt-2"><span class="text-emerald-700 font-semibold">Correct: ${esc(t.correct || '-')}</span> · <span class="text-[#0b3d2b]/70">Student chose: ${esc(t.chosen || '-')}</span></p>
                </div>
                <div id="admin-chat-msgs" class="max-h-72 overflow-y-auto mb-2">${chatMsgsHtml(I.msgs, 'admin', t.studentName)}</div>
                <textarea id="admin-chat-input" rows="3" maxlength="1000" placeholder="Type your explanation…" class="w-full bg-white border border-[#d9d4c3] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0b5a3c]"></textarea>
                <button id="admin-chat-send" onclick="sendAdminReply()" class="mt-2 w-full bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm rounded-xl py-2.5 transition">Send reply</button>
            </div>`;
        }

        function adminInboxCard() {
            const canAsk = 'Notification' in window && Notification.permission === 'default';
            return `<div class="bg-white border border-[#e8e2d2] rounded-2xl p-5 mt-6">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <h2 class="font-display font-bold text-lg">💬 Student questions ${adminBadgeHtml()}</h2>
                    ${canAsk ? '<button onclick="askNotifPermission()" class="text-xs font-semibold text-[#0b5a3c] hover:underline">🔔 Turn on alerts</button>' : ''}
                </div>
                <p class="text-xs text-[#0b3d2b]/60 mt-1 mb-3">Students ask from Answer review. You are alerted the moment a message arrives while the app is open.</p>
                <div id="admin-inbox-list" class="space-y-2 max-h-72 overflow-y-auto">${adminInboxListHtml()}</div>
                <div id="admin-chat">${adminChatHtml()}</div>
            </div>`;
        }

        function paintAdminChat() {
            const el = document.getElementById('admin-chat');
            if (el) el.innerHTML = adminChatHtml();
        }

        async function openAdminThread(tid) {
            const I = state.inbox;
            if (I.unsub) { try { I.unsub(); } catch (_) {} I.unsub = null; }
            I.open = tid; I.msgs = [];
            updateAdminBadges();
            paintAdminChat();
            const box = document.getElementById('admin-chat');
            if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            I.unsub = onSnapshot(query(collection(db, 'threads', tid, 'messages'), orderBy('createdAt', 'asc')), snap => {
                if (I.open !== tid) return;
                I.msgs = snap.docs.map(d => d.data());
                const t = I.threads.find(x => x.id === tid);
                const el = document.getElementById('admin-chat-msgs');
                if (el) { el.innerHTML = chatMsgsHtml(I.msgs, 'admin', t && t.studentName); el.scrollTop = el.scrollHeight; }
            }, err => console.error('admin chat listen', err));
            const t = I.threads.find(x => x.id === tid);
            if (t && t.unreadAdmin) { try { await updateDoc(doc(db, 'threads', tid), { unreadAdmin: false }); } catch (e) { console.error(e); } }
        }

        function closeAdminThread() {
            const I = state.inbox;
            if (I.unsub) { try { I.unsub(); } catch (_) {} I.unsub = null; }
            I.open = null; I.msgs = [];
            updateAdminBadges();
            paintAdminChat();
        }

        async function sendAdminReply() {
            const I = state.inbox, tid = I.open;
            if (!tid || !state.isAdmin) return;
            const inp = document.getElementById('admin-chat-input');
            const text = (inp ? inp.value : '').trim().slice(0, 1000);
            if (!text) return;
            const btn = document.getElementById('admin-chat-send');
            if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
            try {
                await addDoc(collection(db, 'threads', tid, 'messages'), { uid: state.user.uid, role: 'admin', text, createdAt: serverTimestamp() });
                await updateDoc(doc(db, 'threads', tid), { lastMessage: text.slice(0, 200), lastRole: 'admin', lastAt: serverTimestamp(), unreadStudent: true, unreadAdmin: false });
                if (inp) inp.value = '';
            } catch (e) { alert(friendlyError(e)); }
            finally { const b = document.getElementById('admin-chat-send'); if (b) { b.disabled = false; b.textContent = 'Send reply'; } }
        }

        function askNotifPermission() {
            try { Notification.requestPermission().then(() => { if (state.currentView === 'admin') render(); }); } catch (_) {}
        }

        async function openThreadFromToast(tid) {
            if (state.currentView !== 'admin') await openAdmin();
            openAdminThread(tid);
        }

        function notifyAdmin(t, id) {
            showToast('💬 ' + (t.studentName || 'Student') + ': ' + (t.lastMessage || 'New question'), () => openThreadFromToast(id));
            beep();
            try {
                if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
                    new Notification('New student question', { body: (t.studentName || 'Student') + ': ' + (t.lastMessage || '') });
                }
            } catch (_) {}
        }

        function stopMessaging() {
            msgUnsubs.forEach(u => { try { u(); } catch (_) {} });
            msgUnsubs = [];
            if (state.inbox && state.inbox.unsub) { try { state.inbox.unsub(); } catch (_) {} }
            state.inbox = { threads: [], open: null, msgs: [], unsub: null };
            state.myThreads = {};
            closeQChat(true);
            adminFirstSnap = true;
        }

        function startMessaging() {
            stopMessaging();
            const uid = state.user && state.user.uid;
            if (!uid) return;
            try {
                if (state.isAdmin) {
                    msgUnsubs.push(onSnapshot(query(collection(db, 'threads'), orderBy('lastAt', 'desc'), limit(100)), snap => {
                        state.inbox.threads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        const viewing = id => state.inbox.open === id && state.currentView === 'admin';
                        if (adminFirstSnap) {
                            adminFirstSnap = false;
                            const n = state.inbox.threads.filter(t => t.unreadAdmin).length;
                            if (n) { showToast('💬 You have ' + n + ' unread student message' + (n > 1 ? 's' : ''), () => openAdmin()); beep(); }
                        } else {
                            snap.docChanges().forEach(c => {
                                if (c.type === 'removed' || c.doc.metadata.hasPendingWrites) return;
                                const t = c.doc.data();
                                if (!(t.unreadAdmin && t.lastRole === 'student')) return;
                                if (viewing(c.doc.id)) { updateDoc(doc(db, 'threads', c.doc.id), { unreadAdmin: false }).catch(() => {}); return; }
                                notifyAdmin(t, c.doc.id);
                            });
                        }
                        updateAdminBadges();
                    }, err => console.error('inbox listen', err)));
                } else {
                    msgUnsubs.push(onSnapshot(query(collection(db, 'threads'), where('uid', '==', uid)), snap => {
                        state.myThreads = {};
                        snap.docs.forEach(d => { state.myThreads[d.id] = d.data(); });
                        const fresh = [];
                        snap.docChanges().forEach(c => {
                            if (c.type === 'removed') return;
                            const t = c.doc.data();
                            if (!(t.unreadStudent && t.lastRole === 'admin')) return;
                            if (state.chat && state.chat.tid === c.doc.id) { updateDoc(doc(db, 'threads', c.doc.id), { unreadStudent: false }).catch(() => {}); return; }
                            fresh.push(t);
                        });
                        if (fresh.length) { showToast('💬 The admin replied to your question. Open Answer review to read it.'); beep(); }
                    }, err => console.error('my threads listen', err)));
                }
            } catch (e) { console.error(e); }
        }

        // Expose handlers used by inline onclick/onsubmit attributes
        Object.assign(window, {
            openQChat, closeQChat, sendQChat, setChatDraft, openAdminThread, closeAdminThread, sendAdminReply, askNotifPermission,
            setView, handleLogin, handleReset, handleRegister, handleLogout, togglePw, openDeleteAccount, closeDeleteAccount, confirmDeleteAccount, startExamSession,
            switchSubject, selectOption, toggleFlag, nextQuestion, prevQuestion, jumpTo,
            confirmSubmit, openAdmin, showDashboard, startReview, reviewPast, closeReview, setReviewTab,
            goToLogin, handleNewPassword, refreshPass, goPay, closePlanReminder, copyAcct, setAdminFilter, grantPass, removePass, openPractice, openWaecPractice, setWpCount, pickWpSubject, startWaecPractice, openExamSetup, openWaecSetup, pickWaecSubject, startWaec, waecSelect, waecFlag, waecNext, waecPrev, waecJump, waecConfirmSubmit, waecQuit, startWaecReview, togglePick, refreshLeaderboard, setPCount, startPractice, practiceAnswer, practiceNext, practicePrev, practiceFlag, practiceJump, practiceGoSubject, openSettings, closeSettings, shareApp, rateApp, practiceFinishNow, resumeAttempt, quitPractice, startPracticeReview
        });

        // Opened from an email link? (?mode=verifyEmail&oobCode=... or ?mode=resetPassword&oobCode=...)
        (function () {
            const q = new URLSearchParams(location.search);
            const mode = q.get('mode'), code = q.get('oobCode');
            if (mode && code) {
                state.action = { mode, code, status: 'working', msg: '', email: '' };
                state.currentView = 'action';
                render();
                runAction();
                return;
            }
            render();
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
        }
    </script>

    <script>
        // Discourage copying text from the page (browser-level protection is not absolute).
        document.addEventListener('copy', function (event) {
            event.preventDefault();
        }, true);
        document.addEventListener('cut', function (event) {
            event.preventDefault();
        }, true);
        document.addEventListener('contextmenu', function (event) {
            event.preventDefault();
        }, true);
        document.addEventListener('keydown', function (event) {
            const key = (event.key || '').toLowerCase();
            if ((event.ctrlKey || event.metaKey) && ['c', 'x', 'a'].includes(key)) {
                event.preventDefault();
            }
        }, true);
    </script>

</body>
</html>

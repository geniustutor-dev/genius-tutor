                        `Option A for question ${i} representing foundational concept`,
                        `Option B for question ${i} representing alternative theory`,
                        `Option C for question ${i} representing correct standard solution`,
                        `Option D for question ${i} representing distractor variable`
                    ],
                    answer: 2,
                    explanation: `Explanation for question ${i}.`
                });
            }
            return bank;
        }

        // --- ENGLISH EXAM BUILDER (uses questions.js) ---
        function shuffleArr(a) {
            a = [...a];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        function toItem(row, passage) {
            const [question, correct, ...wrong] = row;
            const opts = shuffleArr([correct, ...wrong]);
            return { question, options: opts, answer: opts.indexOf(correct), passage: passage || null };
        }
        function englishExamSize() {
            const E = window.ENGLISH;
            if (!E) return 60;
            const pq = Math.min(2, Object.keys(E.passages || {}).length) * 5;
            const available = pq + Math.min(5, (E.novel || []).length) + (E.general || []).length;
            return Math.min(60, available);
        }
        function buildEnglishExam() {
            const E = window.ENGLISH;
            if (!E) return getRandomQuestions('english', 60);
            const out = [];
            shuffleArr(Object.keys(E.passages || {})).slice(0, 2).forEach(k => {
                E.passages[k].qs.forEach(r => out.push(toItem(r, E.passages[k].text)));
            });
            const novel = shuffleArr(E.novel || []).slice(0, 5).map(r => toItem(r));
            const need = 60 - out.length - novel.length;
            const general = shuffleArr(E.general || []).slice(0, Math.max(0, need)).map(r => toItem(r));
            return [...out, ...general, ...novel];
        }

            const rows = REAL_BANKS[key];

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('login-btn');
            showLoginError('');
            touchActive();
            btn.disabled = true; btn.textContent = 'Signing in…';
            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                if (!cred.user.emailVerified) {
                    try { await sendEmailVerification(cred.user); } catch (_) {}
                    await signOut(auth);
                    setView('login', 'Your email is not verified yet. We just re-sent the verification link. Check your inbox (and spam), click it, then sign in.');
                    return;
                }
                await loadProfile(cred.user);
                showDashboard();
            } catch (err) {
                showLoginError(friendlyError(err));
                btn.disabled = false; btn.textContent = 'Sign in';
            }
        }

        async function handleReset() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) { showLoginError('Type your email in the Email box first, then tap Forgot password.'); return; }

        // --- REGISTER ---
        function subjectOptions(selected) {
            return ['chemistry','physics','biology','mathematics','economics','government','literature']
                .map(s => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('');
        }
        const selectCls = "w-full mt-0.5 bg-white border border-[#d9d4c3] rounded-lg px-3 py-2 text-sm text-[#0b3d2b] focus:outline-none focus:border-[#0b5a3c]";
        const inputCls = "w-full bg-white border border-[#d9d4c3] rounded-lg px-3 py-2.5 text-sm text-[#0b3d2b] placeholder-[#9bb0a5] focus:outline-none focus:border-[#0b5a3c] focus:ring-1 focus:ring-[#0b5a3c]";

        function renderRegister() {
            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2] text-[#0b3d2b]">
                    <header class="bg-gradient-to-b from-[#0b6b45] to-[#00170f] px-4 sm:px-8 py-3">
                        <button onclick="setView('home')" class="flex items-center gap-2.5 text-left">
                            <div class="w-8 h-8 rounded-lg bg-[#f4b731] text-[#0b3d2b] flex items-center justify-center">🎓</div>
                            <div class="leading-tight text-white">
                                <p class="font-display font-bold text-xs tracking-wide">GENIUS TUTOR</p>
                                <p class="text-[9px] font-semibold tracking-[0.2em] text-[#f4b731]">JAMB CBT</p>
                            </div>
                        </button>
                    </header>

                    <main class="flex-1 px-4 pt-8 sm:pt-12 pb-10">
                        <div class="max-w-sm sm:max-w-md mx-auto bg-white border border-[#e8e2d2] rounded-2xl p-6 sm:p-8 shadow-sm">
                            <p class="text-[10px] font-semibold tracking-[0.2em] text-[#0b5a3c]">GENIUS TUTOR JAMB CBT</p>
                            <h1 class="font-display font-bold text-xl mt-1">Create your account</h1>
                            <p class="text-xs text-[#0b3d2b]/60 mt-1">A verification link will be emailed to you.</p>

                            <form onsubmit="handleRegister(event)" class="mt-5 space-y-4">
                                <div>
                                    <label for="regFullName" class="block text-xs font-medium mb-1.5">Full name</label>
                                    <input type="text" id="regFullName" required autocomplete="name" class="${inputCls}">
                                </div>
                                <div>
                                    <label for="regNumberInput" class="block text-xs font-medium mb-1.5">JAMB registration number</label>
                                    <input type="text" id="regNumberInput" required class="${inputCls}">
                                </div>
                                <div>
                                    <label for="regEmailInput" class="block text-xs font-medium mb-1.5">Email address</label>
                                    <input type="email" id="regEmailInput" required autocomplete="email" class="${inputCls}">
                                </div>
                                <div>
                                    <label for="regPassword" class="block text-xs font-medium mb-1.5">Password</label>
                                    <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" class="${inputCls}">
                                </div>
                                <div class="bg-[#faf8f2] p-3 rounded-xl border border-[#e8e2d2] space-y-2.5">
                                    <p class="text-xs font-semibold text-[#0b5a3c] uppercase tracking-wider">Subject combination</p>
                                    <p class="text-[11px] text-[#0b3d2b]/60 leading-relaxed">These are your default picks. You can change them before every exam or practice.</p>
                                    <div>
                                        <span class="text-[11px] text-[#0b3d2b]/60">1. Use of English (compulsory)</span>
                                        <input type="text" disabled value="Use of English" class="w-full mt-0.5 bg-[#eef1ec] border border-[#e8e2d2] rounded-lg px-3 py-2 text-sm text-[#0b3d2b]/70">
                                    </div>
                                    <div><span class="text-[11px] text-[#0b3d2b]/60">2. Second subject</span><select id="regSub2" class="${selectCls}">${subjectOptions('chemistry')}</select></div>
                                    <div><span class="text-[11px] text-[#0b3d2b]/60">3. Third subject</span><select id="regSub3" class="${selectCls}">${subjectOptions('physics')}</select></div>
                                    <div><span class="text-[11px] text-[#0b3d2b]/60">4. Fourth subject</span><select id="regSub4" class="${selectCls}">${subjectOptions('biology')}</select></div>
                                </div>
                                <button type="submit" id="submit-btn" class="w-full bg-[#066c43] hover:bg-[#055a37] text-white font-semibold text-sm py-2.5 rounded-lg transition">Create Account 📧</button>
                            </form>

                            <p class="text-center text-xs text-[#0b3d2b]/70 mt-5">Already registered? <button onclick="setView('login')" class="font-semibold text-[#0b5a3c] hover:underline">Sign in</button></p>
                            <p class="text-center mt-3"><button onclick="setView('home')" class="text-[11px] text-[#0b3d2b]/50 hover:text-[#0b3d2b]">← Back to home</button></p>
                        </div>
                    </main>
                </div>`;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regFullName').value.trim();
            const regNumber = document.getElementById('regNumberInput').value.trim();
            const email = document.getElementById('regEmailInput').value.trim();
            const password = document.getElementById('regPassword').value;
            const subs = ['regSub2','regSub3','regSub4'].map(id => document.getElementById(id).value);

            if (new Set(subs).size !== 3) { alert('Please choose three different subjects.'); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = 'Creating account…';
            registering = true;
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, 'users', cred.user.uid), {
                    name, regNumber, email,
                    subjects: ['english', ...subs],
                    createdAt: serverTimestamp()
                });
                await sendEmailVerification(cred.user);
                await signOut(auth);
                registering = false;
                setView('login', 'Account created! A verification link was sent to ' + email + '. Click it, then sign in here.');
            } catch (err) {
                registering = false;
                alert(friendlyError(err));
                btn.disabled = false; btn.textContent = 'Create Account 📧';
            }
        }

        // --- DASHBOARD ---
        function subjLabel(sub) {
            const m = { english: 'Use of English', literature: 'Literature in English' };
            return m[sub] || (sub.charAt(0).toUpperCase() + sub.slice(1));
        }

        const OTHER_SUBJECTS = ['chemistry', 'physics', 'biology', 'mathematics', 'economics', 'government', 'literature'];
        const PRACTICE_SECS_PER_Q = 40;   // same pace as the real exam: 180 questions in 120 minutes
        let practiceInterval = null;

        function hasRealQuestions(sub) {
            if (sub === 'english') return !!window.ENGLISH;
            return !!(REAL_BANKS[sub] && REAL_BANKS[sub].length);
        }

        function defaultPicks() {
            const reg = ((state.user && state.user.subjects) || []).filter(s => OTHER_SUBJECTS.includes(s));
            const out = [...new Set(reg)].slice(0, 3);
            for (const s of OTHER_SUBJECTS) { if (out.length >= 3) break; if (!out.includes(s)) out.push(s); }
            return out;
        }

        function pickList(kind) { return kind === 'exam' ? state.esetup.subjects : state.psetup.subjects; }

        function togglePick(kind, sub) {
            const list = pickList(kind);
            const i = list.indexOf(sub);
            state.pickMsg = '';
            if (i >= 0) list.splice(i, 1);
            else if (list.length >= 3) state.pickMsg = 'Only 3 subjects besides English. Tap a chosen one to remove it first.';
            else list.push(sub);
            render();
        }

        function renderSubjectPicker(kind) {
            const picks = pickList(kind);
            const btn = sub => {
                const on = picks.includes(sub);
                return `<button onclick="togglePick('${kind}','${sub}')" class="text-left p-3 rounded-xl border text-sm font-semibold transition ${on ? 'bg-[#e1f3e8] border-[#066c43] text-[#0b3d2b]' : 'bg-[#faf8f2] border-[#e8e2d2] text-[#2f5546] hover:border-[#0b5a3c]'}">
                    <span class="flex items-center justify-between gap-2">
                        <span>${esc(subjLabel(sub))}</span>
                        <span class="w-5 h-5 shrink-0 rounded-full border flex items-center justify-center text-[11px] ${on ? 'bg-[#066c43] border-[#066c43] text-white' : 'border-[#c9c3ad] text-transparent'}">✓</span>
                    </span>
                    ${hasRealQuestions(sub) ? '' : '<span class="block text-[10px] font-medium text-[#8a6500] mt-1">Sample questions</span>'}
                </button>`;
            };
            return `
                <p class="text-xs text-[#7a9588] uppercase font-semibold mt-6 mb-2">Subjects: English + 3 of your choice</p>
                <div class="p-3 rounded-xl border border-[#bfe0cd] bg-[#e1f3e8] text-sm font-semibold flex items-center justify-between">
                    <span>Use of English</span><span class="text-[11px] font-semibold text-[#0b5a3c]">🔒 Compulsory</span>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-2">${OTHER_SUBJECTS.map(btn).join('')}</div>
                <p class="text-xs mt-2 ${picks.length === 3 ? 'text-[#0b5a3c]' : 'text-[#8a6500]'}">${picks.length} of 3 chosen${state.pickMsg ? ' · ' + esc(state.pickMsg) : ''}</p>`;
        }

        // --- EXAM SETUP (choose subjects) ---
        function openExamSetup() {
            if (state.esetup.subjects.length !== 3) state.esetup.subjects = defaultPicks();
            state.pickMsg = '';
            setView('examSetup');
            window.scrollTo(0, 0);
        }

        function renderExamSetup() {
            const picks = state.esetup.subjects;
            const ready = picks.length === 3;
            const sample = picks.some(s => !hasRealQuestions(s));
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2] text-[#0b3d2b]">
                    <div class="max-w-xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-6 sm:p-8 shadow-xl">
                        <span class="bg-[#e1f3e8] text-[#0b5a3c] text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-[#bfe0cd]">Full CBT exam</span>
                        <h2 class="text-2xl font-bold mt-3">Choose your subjects</h2>
                        <p class="text-[#58796b] text-sm mt-1 leading-relaxed">${englishExamSize() + 120} questions · 2 hours. The clock starts as soon as you begin.</p>
                        ${renderSubjectPicker('exam')}
                        ${sample ? `<p class="text-xs text-[#8a6500] bg-[#f6ecc9] border border-[#ecdca4] rounded-lg p-3 mt-4 leading-relaxed">Subjects marked “Sample questions” do not have their real question bank yet.</p>` : ''}
                        <div class="flex gap-3 mt-8">
                            <button onclick="showDashboard()" class="flex-1 bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546] font-semibold py-3 rounded-xl transition">← Back</button>
                            <button onclick="startExamSession()" ${ready ? '' : 'disabled'} class="flex-[2] bg-[#066c43] hover:bg-[#055a37] text-white font-semibold py-3 rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">Begin exam 🚀</button>
                        </div>
                    </div>
                </div>`;
        }

        // --- LEADERBOARD CARD (dashboard) ---
        function leaderboardCard() {
            const lb = state.leaderboard;
            const u = state.user;
            let body;
            if (lb === null) body = `<p class="p-5 text-sm text-[#0b3d2b]/60">Loading leaderboard…</p>`;
            else if (lb.error) body = `<p class="p-5 text-sm text-[#0b3d2b]/60">${state.isAdmin ? 'The leaderboard could not load (' + esc(lb.error) + '). Publish the leaderboard rule in your Firestore rules.' : 'The leaderboard is not available right now. Please try again later.'}</p>`;
            else if (!lb.rows.length) body = `<p class="p-5 text-sm text-[#0b3d2b]/60">No scores yet. Finish a full exam to be the first on the board.</p>`;
            else {
                let prevRank = 0;
                body = lb.rows.map((r, i) => {
                    const rank = i > 0 && r.bestScore === lb.rows[i - 1].bestScore ? prevRank : i + 1;
                    prevRank = rank;
                    const me = r.id === u.uid;
                    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                    return `<div class="flex items-center gap-3 px-4 sm:px-5 py-3 ${i ? 'border-t border-[#efe9d9]' : ''} ${me ? 'bg-[#e1f3e8]' : ''}">
                        <span class="w-8 text-center font-display font-bold ${rank <= 3 ? 'text-xl' : 'text-sm text-[#0b3d2b]/60'}">${medal}</span>
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-semibold truncate">${esc(r.name || 'Student')}${me ? ' <span class="text-[11px] font-semibold text-[#0b5a3c]">(you)</span>' : ''}</p>
                            <p class="text-[11px] text-[#0b3d2b]/55">${esc(r.exams || 1)} full ${r.exams === 1 ? 'exam' : 'exams'}</p>

                        <p class="font-display font-bold text-lg text-[#066c43] shrink-0">${esc(r.bestScore)}<span class="text-xs font-medium text-[#0b3d2b]/50"> / 400</span></p>
                    </div>`;
                }).join('');
            }
            let footer = '';
            if (lb && !lb.error) {
                footer = lb.myBest === null ? 'Sit a full exam to get on the leaderboard.' : `Your best: ${lb.myBest} / 400 · Position #${lb.myRank ?? '–'}`;
            }
            return `
                <div class="flex items-center justify-between mt-10 mb-3">
                    <div>
                        <h2 class="font-display font-bold text-xl">🏆 Leaderboard</h2>
                        <p class="text-xs text-[#0b3d2b]/55">Top 10 · best full-exam score out of 400</p>

                    <button onclick="refreshLeaderboard()" class="text-xs font-semibold text-[#0b5a3c] hover:underline">↻ Refresh</button>

                <div class="bg-white border border-[#e8e2d2] rounded-2xl overflow-hidden">
                    ${body}
                    ${footer ? `<p class="px-5 py-3 text-xs font-semibold text-[#0b5a3c] bg-[#f4faf6] border-t border-[#efe9d9]">${footer}</p>` : ''}
                </div>`;
        }

        function renderDashboard() {
            const u = state.user;
            const first = (u.name || '').trim().split(/\s+/)[0] || 'there';
            const hello = first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
            const totalQs = englishExamSize() + 120;
            const h = state.history;
            const ph = state.practiceHistory || [];
            const card = 'bg-white border border-[#e8e2d2] rounded-2xl';
            const ts = x => (x.startedAt && x.startedAt.toMillis ? x.startedAt.toMillis() : 0);

            // ----- progress numbers -----
            let statsHtml = `<div class="${card} p-4 text-sm text-[#0b3d2b]/60">Loading your progress…</div>`;
            let subjectHtml = '';
            if (h !== null) {
                const pTotal = ph.reduce((a, x) => a + (x.totalQuestions || 0), 0);
                const pRight = ph.reduce((a, x) => a + (x.rawScore || 0), 0);
                const avg = h.length ? Math.round(h.reduce((a, x) => a + x.scaledScore, 0) / h.length) : '–';
                const best = h.length ? Math.max(...h.map(x => x.scaledScore)) : '–';
                const stat = (label, val, sub) => `<div class="${card} p-4"><p class="font-display font-bold text-2xl">${val}</p><p class="text-xs text-[#0b3d2b]/60 mt-0.5">${label}</p>${sub ? `<p class="text-[11px] text-[#0b5a3c] mt-1">${sub}</p>` : ''}</div>`;
                statsHtml = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    ${stat('Full exams taken', h.length)}
                    ${stat('Average score', avg === '–' ? '–' : avg + ' / 400')}
                    ${stat('Best score', best === '–' ? '–' : best + ' / 400')}
                    ${stat('Practice sessions', ph.length, ph.length && pTotal ? Math.round(pRight / pTotal * 100) + '% correct on average' : '')}
                </div>`;

                const subj = {};
                h.forEach(x => Object.entries(x.breakdown || {}).forEach(([k, v]) => {
                    const o = subj[k] = subj[k] || { c: 0, t: 0, best: 0 };
                    o.c += v.score; o.t += v.total;
                    if (v.total) o.best = Math.max(o.best, Math.round(v.score / v.total * 100));
                }));
                subjectHtml = Object.keys(subj).length ? `
                    <h2 class="font-display font-bold text-xl mt-10 mb-3">Progress by subject</h2>
                    <div class="${card} p-5 space-y-4">
                        ${Object.entries(subj).map(([k, v]) => {
                            const pct = v.t ? Math.round(v.c / v.t * 100) : 0;
                            return `<div>
                                <div class="flex justify-between text-sm"><span class="font-medium">${esc(subjLabel(k))}</span><span class="text-[#0b3d2b]/60 text-xs">avg ${pct}% · best ${v.best}%</span></div>
                                <div class="h-2 bg-[#e8f0ea] rounded-full mt-1.5"><div class="h-2 bg-[#066c43] rounded-full" style="width:${pct}%"></div></div>
                            </div>`;
                        }).join('')}
                    </div>` : '';
            }

            // ----- recent activity -----
            const activity = h === null ? [] : [
                ...h.map(x => ({ ...x, kind: 'exam' })),
                ...ph.map(x => ({ ...x, kind: 'practice' }))
            ].sort((a, b) => ts(b) - ts(a)).slice(0, 10);
            const activityHtml = h === null ? '' : `
                <h2 class="font-display font-bold text-xl mt-10 mb-3">Recent activity</h2>
                <div class="${card} overflow-hidden">
                    ${activity.length === 0 ? `<p class="p-5 text-sm text-[#0b3d2b]/60">Nothing here yet. Your exams and practice sessions will show up here, and you can review the answers of every full exam.</p>` :
                    activity.map((x, i) => {
                        const raw = x.rawScore !== undefined ? x.rawScore : null;
                        const tot = x.totalQuestions || null;
                        const pct = raw !== null && tot ? Math.round(raw / tot * 100) : (x.scaledScore !== undefined ? Math.round(x.scaledScore / 4) : 0);
                        const title = x.kind === 'exam' ? 'Full CBT exam' : 'Practice · ' + (x.subjects && x.subjects.length ? x.subjects.map(z => subjLabel(z)).join(', ') : subjLabel(x.subject || ''));
                        return `<div class="flex items-center justify-between gap-3 px-5 py-3.5 ${i ? 'border-t border-[#efe9d9]' : ''}">
                            <div class="min-w-0">
                                <p class="text-sm font-semibold truncate">${esc(title)}</p>
                                <p class="text-xs text-[#0b3d2b]/55">${esc(fmtTime(x.startedAt))}</p>
                                ${(x.kind === 'exam' || x.hasReview) ? `<button onclick="reviewPast('${x.id}')" class="text-xs font-semibold text-[#0b5a3c] hover:underline mt-1">Review answers →</button>` : ''}
                            </div>
                            <div class="text-right shrink-0">
                                <p class="font-display font-bold text-lg text-[#066c43]">${pct}%</p>
                                <p class="text-[11px] text-[#0b3d2b]/55">${raw !== null && tot ? raw + '/' + tot : ''}${x.kind === 'exam' && x.scaledScore !== undefined ? ' · ' + x.scaledScore + '/400' : ''}</p>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;

            const leaderboardHtml = leaderboardCard();

            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2] text-[#0b3d2b]">
                    <header class="sticky top-0 z-20 bg-white border-b border-[#e8e2d2]">
                        <div class="max-w-5xl xl:max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg bg-[#066c43] text-white flex items-center justify-center text-sm">🎓</div>
                                <div class="leading-tight">
                                    <p class="font-display font-bold text-xs">GENIUS TUTOR</p>
                                    <p class="text-[9px] font-semibold tracking-[0.2em] text-[#b88700]">JAMB CBT</p>
                                </div>
                            </div>

                                    <span class="text-[11px] bg-white/10 rounded-full px-2.5 py-1">Use of English</span><span class="text-[11px] bg-white/10 rounded-full px-2.5 py-1">+ 3 subjects you choose</span>

                    <footer class="max-w-5xl xl:max-w-6xl mx-auto w-full px-4 mt-6 mb-6 pt-4 border-t border-[#e8e2d2] flex flex-wrap gap-2 justify-between text-xs text-[#0b3d2b]/55">

        }

        async function handleLogout() {
            await signOut(auth);
            state.user = null; state.isAdmin = false; state.history = null; state.leaderboard = null;
            setView('home');
        }

        async function startExamSession() {
            const u = state.user;
            const picks = state.esetup.subjects;
            if (picks.length !== 3) return;
            state.examSubjects = ['english', ...picks];
            state.examData = { english: buildEnglishExam() };
            picks.forEach(sub => { state.examData[sub] = getRandomQuestions(sub, 40); });
            state.activeSubject = 'english';
            state.currentIndex = 0;
            state.answers = {};
            state.flagged = {};
            state.timeLeft = 7200;
            state.sessionId = null;
            state.saveError = false;
            // Fallback (offline): use the device clock. Normally the deadline comes from the server.
            state.serverOffset = 0;
            state.deadline = Date.now() + 7200000;

            try {
                const ref = await addDoc(collection(db, 'sessions'), {
                    uid: u.uid, name: u.name, regNumber: u.regNumber,
                    subjects: state.examSubjects, status: 'In progress',
                    startedAt: serverTimestamp()
                });
                state.sessionId = ref.id;
                const snap = await getDoc(ref);
                const t = snap.data() && snap.data().startedAt;
                if (t && t.toMillis) {
                    const startMs = t.toMillis();           // official start time, set by the server
                    state.serverOffset = startMs - Date.now();
                    state.deadline = startMs + 7200000;     // official end time = start + 2 hours
                }
            } catch (err) { console.error('Could not log session start', err); }

            setView('exam');
            startTimer();
        }

        // --- EXAM ---
        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const tick = () => {
                state.timeLeft = Math.max(0, Math.round((state.deadline - (Date.now() + state.serverOffset)) / 1000));
                updateTimerDisplay();
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    alert('Time is up! Submitting exam automatically.');
                    submitExam();
                }
            };
            state.timerInterval = setInterval(tick, 1000);
            tick();
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (!el) return;
            const h = Math.floor(state.timeLeft / 3600);
            const m = Math.floor((state.timeLeft % 3600) / 60);
            const s = state.timeLeft % 60;
            el.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
            if (state.timeLeft < 300) el.classList.add('text-rose-500', 'animate-pulse');
        }

        function renderExam() {
            const questions = state.examData[state.activeSubject];
            const q = questions[state.currentIndex];
            const total = questions.length;
            const ansKey = `${state.activeSubject}-${state.currentIndex}`;

            let totalAnswered = 0, totalCount = 0;
            state.examSubjects.forEach(sub => {
                const len = state.examData[sub].length;
                totalCount += len;
                for (let i = 0; i < len; i++) if (state.answers[`${sub}-${i}`] !== undefined) totalAnswered++;
            });

            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2]">
                    <div class="sticky top-0 z-30">
                    <header class="bg-white border-b border-[#e8e2d2] px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <h2 class="font-bold text-[#0b3d2b] tracking-wide">Genius Tutor CBT</h2>
                            <p class="text-xs text-[#58796b] truncate">Candidate: <span class="text-[#0b5a3c] font-medium">${esc(state.user.name)}</span></p>
                        </div>
                        <div class="flex items-center gap-3 sm:gap-6 shrink-0">
                            <div class="bg-[#faf8f2] px-3 sm:px-4 py-2 rounded-xl border border-[#e8e2d2] flex items-center gap-2">
                                <span class="text-xs text-[#58796b] font-semibold uppercase">Time:</span>
                                <span id="timer-display" class="font-mono text-emerald-700 font-bold text-lg">02:00:00</span>
                            </div>
                            <button onclick="confirmSubmit()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-rose-600/20 transition">Submit Exam</button>
                        </div>
                    </header>

                    <div class="bg-[#faf8f2] border-b border-[#e8e2d2] px-4 sm:px-6 py-2.5 flex gap-2 overflow-x-auto">
                        ${state.examSubjects.map(sub => `
                            <button onclick="switchSubject('${sub}')" class="px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition whitespace-nowrap ${state.activeSubject === sub ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-white text-[#58796b] hover:text-[#0b3d2b] border border-[#e8e2d2]'}">
                                ${esc(sub)} (${state.examData[sub].length} Qs)
                            </button>`).join('')}
                    </div>
                    </div>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 items-start max-w-7xl mx-auto w-full p-4 sm:p-6 gap-4 sm:gap-6">
                        <div class="lg:col-span-3 bg-white border border-[#e8e2d2] rounded-2xl p-4 sm:p-6 lg:p-8 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="flex items-center justify-between mb-6">
                                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-[#e1f3e8] text-[#0b5a3c] border border-[#bfe0cd] uppercase">
                                        ${esc(state.activeSubject)} — Question ${state.currentIndex + 1} of ${total}
                                    </span>
                                    <button onclick="toggleFlag()" class="text-xs font-semibold px-3 py-1 rounded-full border transition ${isFlagged ? 'bg-amber-500/20 text-amber-700 border-amber-500/40' : 'bg-[#eef1ec] text-[#58796b] border-[#d9d4c3] hover:text-[#0b3d2b]'}">
                                        ${isFlagged ? '🚩 Flagged' : '🏳️ Flag for Review'}
                                    </button>
                                </div>
                                ${q.passage ? `<div class="mb-5 p-4 rounded-xl bg-[#faf8f2] border border-[#e8e2d2] text-sm text-[#2f5546] leading-relaxed max-h-64 overflow-y-auto"><p class="text-xs font-semibold text-[#0b5a3c] uppercase mb-2">Read the passage and answer the question</p>${esc(q.passage)}</div>` : ''}
                                <h3 class="text-lg sm:text-xl font-medium text-[#0b3d2b] mb-6 leading-relaxed">${esc(q.question)}</h3>
                                <div class="space-y-3">
                                    ${q.options.map((opt, idx) => `
                                        <label onclick="selectOption(${idx})" class="flex items-center gap-4 p-4 rounded-xl border cursor-pointer transition ${selectedOpt === idx ? 'bg-[#e1f3e8] border-[#0b5a3c] text-[#0b3d2b]' : 'bg-[#faf8f2] border-[#e8e2d2] text-[#2f5546] hover:border-[#0b5a3c]'}">
                                            <span class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs ${selectedOpt === idx ? 'bg-indigo-600 text-white' : 'bg-white text-[#58796b] border border-[#e8e2d2]'}">${String.fromCharCode(65 + idx)}</span>
                                            <span class="text-sm font-medium">${esc(opt)}</span>
                                        </label>`).join('')}
                                </div>
                            </div>
                            <div class="flex items-center justify-between pt-6 mt-6 border-t border-[#e8e2d2]">
                                <button onclick="prevQuestion()" ${state.currentIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-[#eef1ec] text-[#2f5546] font-semibold text-xs hover:bg-[#e1e7e0] disabled:opacity-40 disabled:cursor-not-allowed transition">← Previous</button>
                                <button onclick="nextQuestion()" ${state.currentIndex === total - 1 ? 'disabled' : ''} class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/20 disabled:opacity-40 disabled:cursor-not-allowed transition">Next →</button>
                            </div>
                        </div>

                        <div class="bg-white border border-[#e8e2d2] rounded-2xl p-4 sm:p-6 flex flex-col shadow-xl lg:sticky lg:top-32">
                            <h4 class="font-bold text-[#0b3d2b] text-sm mb-2 uppercase tracking-wide">${esc(state.activeSubject)} Palette</h4>
                            <p class="text-xs text-[#58796b] mb-4">Click any number to jump</p>
                            <div class="grid grid-cols-8 sm:grid-cols-10 lg:grid-cols-5 gap-1.5 mb-6">
                                ${questions.map((_, idx) => {
                                    const k = `${state.activeSubject}-${idx}`;
                                    let cls = "bg-[#faf8f2] text-[#58796b] border-[#e8e2d2]";
                                    if (state.answers[k] !== undefined) cls = "bg-[#cfeadb] text-[#0b5a3c] border-[#0b5a3c]";
                                    if (state.currentIndex === idx) cls = "border-2 border-[#0b5a3c] text-[#0b3d2b] bg-[#e1f3e8]";
                                    if (state.flagged[k]) cls = "bg-amber-500/20 text-amber-800 border-amber-500/50";
                                    return `<button onclick="jumpTo(${idx})" class="h-9 rounded-lg font-bold text-xs border transition ${cls}">${idx + 1}</button>`;
                                }).join('')}
                            </div>
                            <div class="mt-auto space-y-2 text-xs text-[#58796b] pt-4 border-t border-[#e8e2d2]">
                                <div class="flex justify-between"><span>Total answered:</span><span class="font-bold text-emerald-700">${totalAnswered} / ${totalCount}</span></div>
                                <div class="flex justify-between"><span>Unanswered:</span><span class="font-bold text-[#2f5546]">${totalCount - totalAnswered}</span></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function switchSubject(sub) { state.activeSubject = sub; state.currentIndex = 0; render(); }
        function selectOption(i) { state.answers[`${state.activeSubject}-${state.currentIndex}`] = i; render(); }
        function toggleFlag() { const k = `${state.activeSubject}-${state.currentIndex}`; state.flagged[k] = !state.flagged[k]; render(); }
        function nextQuestion() { if (state.currentIndex < state.examData[state.activeSubject].length - 1) { state.currentIndex++; render(); } }
        function prevQuestion() { if (state.currentIndex > 0) { state.currentIndex--; render(); } }
        function jumpTo(i) { state.currentIndex = i; render(); }
        function confirmSubmit() { if (confirm('Are you sure you want to submit your complete 4-subject JAMB exam?')) submitExam(); }

        function computeResult() {
            let totalScore = 0, totalCount = 0;
            const breakdown = {};
            state.examSubjects.forEach(sub => {
                let sc = 0;
                state.examData[sub].forEach((q, idx) => { if (state.answers[`${sub}-${idx}`] === q.answer) sc++; });
                breakdown[sub] = { score: sc, total: state.examData[sub].length };
                totalScore += sc;
                totalCount += state.examData[sub].length;
            });
            return { totalScore, totalCount, breakdown, scaled: Math.round((totalScore / totalCount) * 400) };
        }

        function buildReviewItems() {
            const items = [];
            state.examSubjects.forEach(sub => {
                state.examData[sub].forEach((q, idx) => {
                    const c = state.answers[`${sub}-${idx}`];
                    items.push({ s: sub, q: q.question, o: q.options, a: q.answer, c: c === undefined ? -1 : c, p: q.passage || null });
                });
            });
            return items;
        }

        async function submitExam() {
            if (state.currentView !== 'exam') return;
            if (state.timerInterval) clearInterval(state.timerInterval);
            const r = computeResult();
            state.saveError = false;
            setView('result');
            if (!state.sessionId) { state.saveError = true; render(); return; }
            try {
                await updateDoc(doc(db, 'sessions', state.sessionId), {
                    status: 'Completed',
                    rawScore: r.totalScore,
                    totalQuestions: r.totalCount,
                    scaledScore: r.scaled,
                    breakdown: r.breakdown,
                    submittedAt: serverTimestamp()
                });
                await setDoc(doc(db, 'reviews', state.sessionId), { uid: state.user.uid, items: buildReviewItems() });
                state.history = null;
            } catch (err) {
                console.error('Could not save result', err);
                state.saveError = true;
                if (state.currentView === 'result') render();
            }
        }

        // --- RESULT ---
        function renderResult() {
            const r = computeResult();
            let prediction = "Needs Improvement 📚";
            let color = "text-amber-700 bg-amber-500/10 border-amber-500/20";
            if (r.scaled >= 280) { prediction = "Outstanding! High likelihood for competitive courses 🌟"; color = "text-emerald-700 bg-emerald-500/10 border-emerald-500/20"; }
            else if (r.scaled >= 200) { prediction = "Good standing! Admission eligible 👍"; color = "text-[#0b5a3c] bg-[#e1f3e8] border-[#bfe0cd]"; }

            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2]">
                    <div class="max-w-2xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-8 shadow-xl">
                        <div class="text-center mb-6">
                            <span class="bg-emerald-500/10 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-emerald-500/20">Graded</span>
                            <h2 class="text-3xl font-bold text-[#0b3d2b] mt-3">Examination Scorecard</h2>
                            <p class="text-[#58796b] text-sm">Candidate: <span class="text-[#0b3d2b] font-medium">${esc(state.user.name)}</span> (${esc(state.user.regNumber)})</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-6 text-center">
                            <div class="bg-[#faf8f2] p-5 rounded-xl border border-[#e8e2d2]">
                                <span class="text-xs text-[#7a9588] uppercase font-semibold">Scaled score</span>
                                <p class="text-4xl font-extrabold text-[#0b5a3c] mt-1">${r.scaled} <span class="text-lg text-[#7a9588]">/ 400</span></p>
                            </div>
                            <div class="bg-[#faf8f2] p-5 rounded-xl border border-[#e8e2d2]">
                                <span class="text-xs text-[#7a9588] uppercase font-semibold">Correct</span>
                                <p class="text-4xl font-extrabold text-emerald-700 mt-1">${r.totalScore} <span class="text-lg text-[#7a9588]">/ ${r.totalCount}</span></p>
                                <p class="text-xs text-[#58796b] mt-1">${Math.round(r.totalScore / r.totalCount * 100)}% correct</p>
                            </div>
                        </div>
                        <div class="bg-[#faf8f2] p-4 rounded-xl border border-[#e8e2d2] mb-6 space-y-3">
                            <h4 class="font-bold text-[#0b3d2b] text-xs uppercase tracking-wide">Subject Breakdown</h4>
                            <div class="grid grid-cols-2 gap-3">
                                ${Object.entries(r.breakdown).map(([sub, d]) => `
                                    <div class="bg-white p-3 rounded-lg border border-[#e8e2d2] flex justify-between items-center">
                                        <span class="text-xs text-[#2f5546] uppercase font-medium">${esc(sub)}</span>
                                        <span class="text-xs font-bold text-[#0b5a3c]">${d.score} / ${d.total}</span>
                                    </div>`).join('')}
                            </div>
                        </div>
                        <div class="border rounded-xl p-4 mb-8 flex items-center justify-between ${color}">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider opacity-80">Admission Readiness</span>
                                <p class="text-sm font-bold mt-1">${prediction}</p>
                            </div>
                            <span class="text-2xl">🎯</span>
                        </div>
                        ${state.saveError ? `<div class="mb-4 text-xs bg-amber-500/10 border border-amber-500/30 text-amber-800 rounded-xl p-3 leading-relaxed">Your result could not be saved to your account (no connection, or the exam time had already ended). You can still review your answers below.</div>` : ''}
                        <div class="flex gap-3">
                            <button onclick="startReview()" class="flex-1 bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#0b3d2b] font-semibold py-3 rounded-xl transition">Review answers</button>
                            <button onclick="showDashboard()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">Dashboard</button>
                        </div>
                    </div>
                </div>`;
        }

// --- PROGRESS, HISTORY AND ANSWER REVIEW ---
        async function showDashboard() {
            setView('dashboard');
            if (!state.user) return;
            if (state.history === null) {
                state.leaderboard = null;
                await loadHistory();
                if (state.currentView === 'dashboard') render();
                await loadLeaderboard();
                if (state.currentView === 'dashboard') render();
            }
        }

        function publicName(n) {
            const parts = String(n || '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return 'Student';
            const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
            return parts.length > 1 ? cap(parts[0]) + ' ' + parts[parts.length - 1].charAt(0).toUpperCase() + '.' : cap(parts[0]);
        }

        async function loadLeaderboard() {
            try {
                const top = () => getDocs(query(collection(db, 'leaderboard'), orderBy('bestScore', 'desc'), limit(10)));
                let snap = await top();
                const h = state.history || [];
                const myBest = h.length ? Math.max(...h.map(x => x.scaledScore)) : null;
                if (myBest !== null) {
                    // keep my own leaderboard entry up to date (also adds exams taken before the leaderboard existed)
                    const meRef = doc(db, 'leaderboard', state.user.uid);
                    const meSnap = await getDoc(meRef);
                    const cur = meSnap.exists() ? meSnap.data() : null;
                    if (!cur || cur.bestScore !== myBest || cur.exams !== h.length) {
                        await setDoc(meRef, { uid: state.user.uid, name: publicName(state.user.name), bestScore: myBest, exams: h.length, updatedAt: serverTimestamp() });
                        snap = await top();
                    }
                }
                const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                let myRank = null;
                if (myBest !== null) {
                    try {
                        const c = await getCountFromServer(query(collection(db, 'leaderboard'), where('bestScore', '>', myBest)));
                        myRank = c.data().count + 1;
                    } catch (_) {}
                }
                state.leaderboard = { rows, myBest, myRank };
            } catch (err) {
                console.error('Could not load leaderboard', err);
                state.leaderboard = { error: err.code || 'error', rows: [] };
            }
        }

        async function refreshLeaderboard() {
            state.leaderboard = null;
            render();
            await loadLeaderboard();
            if (state.currentView === 'dashboard') render();
        }

        async function loadHistory() {
            try {
                const snap = await getDocs(query(collection(db, 'sessions'), where('uid', '==', state.user.uid)));
                const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                state.practiceHistory = all.filter(x => x.mode === 'practice');
                state.history = all
                    .filter(x => x.mode !== 'practice' && x.status === 'Completed' && x.scaledScore !== undefined)
                    .sort((a, b) => ((b.startedAt && b.startedAt.toMillis ? b.startedAt.toMillis() : 0) - (a.startedAt && a.startedAt.toMillis ? a.startedAt.toMillis() : 0)));
            } catch (err) {
                console.error('Could not load history', err);
                state.history = [];
            }
        }

        function startReview() {
            state.review = { items: buildReviewItems(), tab: 'all', back: 'result' };
            setView('review');
            window.scrollTo(0, 0);
        }

        async function reviewPast(id) {
            try {
                const snap = await getDoc(doc(db, 'reviews', id));
                if (!snap.exists()) { alert('The answer review for this attempt is not available.'); return; }
                state.review = { items: snap.data().items, tab: 'all', back: 'dashboard' };
                setView('review');
                window.scrollTo(0, 0);
            } catch (err) { alert(friendlyError(err)); }
        }

        function closeReview() { const b = state.review && state.review.back; if (b === 'result') setView('result'); else if (b === 'practiceResult') setView('practiceResult'); else showDashboard(); }
        function setReviewTab(t) { state.review.tab = t; render(); window.scrollTo(0, 0); }

        function renderReview() {
            const R = state.review;
            const subs = [...new Set(R.items.map(i => i.s))];
            const shown = R.items.filter(i => R.tab === 'all' || i.s === R.tab);
            let right = 0, wrong = 0, skipped = 0;
            shown.forEach(i => { if (i.c === -1) skipped++; else if (i.c === i.a) right++; else wrong++; });
            const counter = {};
            let lastP = null;
            const cards = shown.map(i => {
                counter[i.s] = (counter[i.s] || 0) + 1;
                let passageHtml = '';
                if (i.p && i.p !== lastP) {
                    passageHtml = `<div class="mb-4 p-4 rounded-xl bg-[#faf8f2] border border-[#e8e2d2] text-sm text-[#2f5546] leading-relaxed"><p class="text-xs font-semibold text-[#0b5a3c] uppercase mb-2">Passage</p>${esc(i.p)}</div>`;
                }
                lastP = i.p;
                const status = i.c === -1 ? ['Not answered', 'text-[#58796b]'] : (i.c === i.a ? ['Correct', 'text-emerald-700'] : ['Wrong', 'text-rose-700']);
                const opts = i.o.map((opt, idx) => {
                    let cls = 'border-[#e8e2d2] bg-[#faf8f2] text-[#2f5546]', tag = '';
                    if (idx === i.a) { cls = 'border-emerald-500 bg-emerald-500/10 text-emerald-800'; tag = idx === i.c ? '✓ Your answer · Correct' : '✓ Correct answer'; }
                    else if (idx === i.c) { cls = 'border-rose-500 bg-rose-500/10 text-rose-800'; tag = '✗ Your answer'; }
                    return `
                        <div class="flex items-start gap-3 p-3 rounded-xl border ${cls}">
                            <span class="w-6 h-6 shrink-0 rounded-md flex items-center justify-center font-bold text-xs bg-white border border-[#e8e2d2]">${String.fromCharCode(65 + idx)}</span>
                            <div class="text-sm"><span>${esc(opt)}</span>${tag ? `<p class="text-[11px] font-semibold mt-0.5">${tag}</p>` : ''}</div>
                        </div>`;
                }).join('');
                return `${passageHtml}
                    <div class="bg-white border border-[#e8e2d2] rounded-2xl p-5 mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold uppercase text-[#0b5a3c]">${esc(i.s)} · Question ${counter[i.s]}</span>
                            <span class="text-xs font-semibold ${status[1]}">${status[0]}</span>
                        </div>
                        <h3 class="text-base font-medium text-[#0b3d2b] mb-4 leading-relaxed">${esc(i.q)}</h3>
                        <div class="space-y-2">${opts}</div>
                    </div>`;
            }).join('');
            const tabBtn = (key, label) => `<button onclick="setReviewTab('${key}')" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider whitespace-nowrap transition ${R.tab === key ? 'bg-indigo-600 text-white' : 'bg-white text-[#58796b] border border-[#e8e2d2]'}">${label}</button>`;
            return `
                <div class="flex-1 bg-[#faf8f2]">
                    <div class="max-w-3xl mx-auto p-4 sm:p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-bold text-[#0b3d2b]">Answer review</h2>
                            <button onclick="closeReview()" class="bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546] text-xs font-semibold px-4 py-2.5 rounded-xl transition">← Back</button>
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2">${tabBtn('all', 'All')}${subs.map(x => tabBtn(x, esc(x))).join('')}</div>
                        <div class="grid grid-cols-3 gap-2 my-4 text-center text-xs">
                            <div class="bg-white border border-[#e8e2d2] rounded-xl p-3"><p class="text-lg font-bold text-emerald-700">${right}</p>Correct</div>
                            <div class="bg-white border border-[#e8e2d2] rounded-xl p-3"><p class="text-lg font-bold text-rose-700">${wrong}</p>Wrong</div>
                            <div class="bg-white border border-[#e8e2d2] rounded-xl p-3"><p class="text-lg font-bold text-[#2f5546]">${skipped}</p>Not answered</div>
                        </div>
                        ${cards}
                        <button onclick="closeReview()" class="w-full bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#0b3d2b] font-semibold py-3 rounded-xl transition mb-6">← Back</button>
                    </div>
                </div>`;
        }

// --- PRACTICE MODE ---
        function availableFor(sub) {
            if (sub === 'english' && window.ENGLISH) {
                const E = window.ENGLISH;
                return (E.general || []).length + (E.novel || []).length + Object.keys(E.passages || {}).length * 5;
            }
            if (REAL_BANKS[sub] && REAL_BANKS[sub].length) return REAL_BANKS[sub].length;
            return 125;
        }

        function buildPracticeEnglish(n) {
            const E = window.ENGLISH;
            if (!E) return getRandomQuestions('english', n);
            const out = [];
            const keys = Object.keys(E.passages || {});
            if (n >= 20 && keys.length) {
                const k = shuffleArr(keys)[0];
                E.passages[k].qs.forEach(r => out.push(toItem(r, E.passages[k].text)));
            }
            const pool = [...(E.general || []), ...(E.novel || [])];
            const gen = shuffleArr(pool).slice(0, Math.max(0, n - out.length)).map(r => toItem(r));
            return [...out, ...gen];
        }

        function formatClock(sec) {
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return (h ? [h, m, s] : [m, s]).map(n => String(n).padStart(2, '0')).join(':');
        }

        function updatePracticeTimer() {
            const el = document.getElementById('practice-timer');
            if (!el || !state.practice) return;
            el.textContent = formatClock(state.practice.timeLeft);
            if (state.practice.timeLeft < 60) el.classList.add('text-rose-600', 'animate-pulse');
        }

        function startPracticeTimer() {
            if (practiceInterval) clearInterval(practiceInterval);
            const P = state.practice;
            const tick = () => {
                if (state.practice !== P || state.currentView !== 'practice') { clearInterval(practiceInterval); practiceInterval = null; return; }
                P.timeLeft = Math.max(0, Math.round((P.deadline - Date.now()) / 1000));
                updatePracticeTimer();
                if (P.timeLeft <= 0) {
                    clearInterval(practiceInterval); practiceInterval = null;
                    P.timedOut = true;
                    alert('Time is up! Finishing your practice now.');
                    finishPractice();
                }
            };
            practiceInterval = setInterval(tick, 1000);
            tick();
        }

        function openPractice() {
            if (state.psetup.subjects.length !== 3) state.psetup.subjects = defaultPicks();
            state.pickMsg = '';
            setView('practiceSetup');
            window.scrollTo(0, 0);
        }
        function setPCount(n) { state.psetup.count = n; render(); }

        function practicePlan() {
            const subs = ['english', ...state.psetup.subjects];
            const n = state.psetup.count;
            const total = subs.reduce((a, sub) => a + Math.min(n, availableFor(sub)), 0);
            return { subs, total, secs: total * PRACTICE_SECS_PER_Q };
        }

        function renderPracticeSetup() {
            const ps = state.psetup;
            const ready = ps.subjects.length === 3;
            const plan = practicePlan();
            const short = plan.subs.filter(sub => availableFor(sub) < ps.count);
            const sample = plan.subs.some(sub => !hasRealQuestions(sub));
            const pill = (active) => `px-4 py-3 rounded-xl text-sm font-semibold border transition ${active ? 'bg-indigo-600 text-white border-[#0b5a3c]' : 'bg-[#faf8f2] text-[#2f5546] border-[#e8e2d2] hover:border-[#0b5a3c]'}`;
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2] text-[#0b3d2b]">
                    <div class="max-w-xl w-full bg-white border border-[#e8e2d2] rounded-2xl p-6 sm:p-8 shadow-xl">
                        <span class="bg-amber-400/10 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-amber-400/20">Practice mode</span>
                        <h2 class="text-2xl font-bold mt-3">Practise at exam pace</h2>
                        <p class="text-[#58796b] text-sm mt-1 leading-relaxed">Timed, and you see the correct answer after every question. Practice results are kept separate from your full exams.</p>

                        ${renderSubjectPicker('practice')}

                        <p class="text-xs text-[#7a9588] uppercase font-semibold mt-6 mb-2">Questions per subject</p>
                        <div class="grid grid-cols-4 gap-2">
                            ${[5, 10, 20, 40].map(n => `<button onclick="setPCount(${n})" class="${pill(ps.count === n)}">${n}</button>`).join('')}
                        </div>
                        ${short.map(sub => `<p class="text-xs text-amber-800 mt-2">Only ${availableFor(sub)} ${esc(subjLabel(sub))} questions are available right now.</p>`).join('')}
                        ${sample ? `<p class="text-xs text-[#8a6500] bg-[#f6ecc9] border border-[#ecdca4] rounded-lg p-3 mt-3 leading-relaxed">Subjects marked “Sample questions” do not have their real question bank yet.</p>` : ''}

                        <div class="mt-5 text-sm bg-[#faf8f2] border border-[#e8e2d2] rounded-xl p-3 leading-relaxed">
                            ⏱️ <strong>${plan.total} questions</strong> · about <strong>${Math.max(1, Math.round(plan.secs / 60))} minutes</strong> (${PRACTICE_SECS_PER_Q} seconds per question, the same pace as the real exam).
                        </div>

                        <div class="flex gap-3 mt-8">
                            <button onclick="showDashboard()" class="flex-1 bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546] font-semibold py-3 rounded-xl transition">← Back</button>
                            <button onclick="startPractice()" ${ready ? '' : 'disabled'} class="flex-[2] bg-amber-400 hover:bg-amber-300 text-slate-950 font-semibold py-3 rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">Start practice</button>
                        </div>
                    </div>
                </div>`;
        }

        function startPractice() {
            const ps = state.psetup;
            if (ps.subjects.length !== 3) return;
            const subs = ['english', ...ps.subjects];
            const items = [];
            subs.forEach(sub => {
                const part = sub === 'english' ? buildPracticeEnglish(ps.count) : getRandomQuestions(sub, ps.count);
                part.forEach(q => items.push({ ...q, subject: sub }));
            });
            if (!items.length) { alert('No questions are available for these subjects yet.'); return; }
            const secs = items.length * PRACTICE_SECS_PER_Q;
            state.practice = { subjects: subs, items, index: 0, answers: {}, secs, timeLeft: secs, deadline: Date.now() + secs * 1000, timedOut: false };
            setView('practice');
            window.scrollTo(0, 0);
            startPracticeTimer();
        }

        function practiceAnswer(idx) {
            const P = state.practice;
            if (P.answers[P.index] !== undefined) return;
            P.answers[P.index] = idx;
            render();
        }

        function practiceNext() {
            const P = state.practice;
            if (P.index < P.items.length - 1) { P.index++; render(); window.scrollTo(0, 0); }
            else finishPractice();
        }

        function quitPractice() {
            if (confirm('Leave practice? Your progress in this session will not be saved.')) {
                if (practiceInterval) { clearInterval(practiceInterval); practiceInterval = null; }
                showDashboard();
            }
        }

        function practiceScore() {
            const P = state.practice;
            let right = 0;
            P.items.forEach((q, i) => { if (P.answers[i] === q.answer) right++; });
            return right;
        }

        function practiceBreakdown() {
            const P = state.practice;
            const b = {};
            P.items.forEach((q, i) => {
                const o = b[q.subject] = b[q.subject] || { score: 0, total: 0 };
                o.total++;
                if (P.answers[i] === q.answer) o.score++;
            });
            return b;
        }

        function buildPracticeReviewItems() {
            const P = state.practice;
            return P.items.map((q, i) => ({
                s: q.subject, q: q.question, o: q.options, a: q.answer,
                c: P.answers[i] === undefined ? -1 : P.answers[i], p: q.passage || null
            }));
        }

        async function finishPractice() {
            if (state.currentView !== 'practice') return;
            if (practiceInterval) { clearInterval(practiceInterval); practiceInterval = null; }
            const P = state.practice;
            const right = practiceScore();
            setView('practiceResult');
            window.scrollTo(0, 0);
            try {
                const ref = doc(collection(db, 'sessions'));
                let hasReview = false;
                try {
                    await setDoc(doc(db, 'reviews', ref.id), { uid: state.user.uid, items: buildPracticeReviewItems() });
                    hasReview = true;
                } catch (e) { console.error('Could not save practice review', e); }
                await setDoc(ref, {
                    uid: state.user.uid, name: state.user.name, regNumber: state.user.regNumber,
                    subjects: P.subjects, mode: 'practice', status: 'Practice',
                    rawScore: right, totalQuestions: P.items.length,
                    breakdown: practiceBreakdown(), timeAllowedSecs: P.secs, hasReview,
                    startedAt: serverTimestamp()
                });
                state.history = null;
            } catch (err) { console.error('Could not save practice result', err); }
        }

        function renderPractice() {
            const P = state.practice;
            const q = P.items[P.index];
            const total = P.items.length;
            const chosen = P.answers[P.index];
            const done = chosen !== undefined;
            const isLast = P.index === total - 1;
            const answered = Object.keys(P.answers).length;
            const pct = Math.round(((P.index + (done ? 1 : 0)) / total) * 100);
            const opts = q.options.map((opt, idx) => {
                let cls = 'bg-[#faf8f2] border-[#e8e2d2] text-[#2f5546] hover:border-[#0b5a3c]';
                if (done) {
                    cls = 'bg-[#faf8f2] border-[#e8e2d2] text-[#7a9588]';
                    if (idx === q.answer) cls = 'bg-emerald-500/10 border-emerald-500 text-emerald-800';
                    else if (idx === chosen) cls = 'bg-rose-500/10 border-rose-500 text-rose-800';
                }
                return `
                    <button ${done ? 'disabled' : ''} onclick="practiceAnswer(${idx})" class="w-full text-left flex items-center gap-4 p-4 rounded-xl border transition ${cls}">
                        <span class="w-7 h-7 shrink-0 rounded-lg flex items-center justify-center font-bold text-xs bg-white border border-[#e8e2d2]">${String.fromCharCode(65 + idx)}</span>
                        <span class="text-sm font-medium">${esc(opt)}</span>
                    </button>`;
            }).join('');
            const feedback = !done ? '' : (chosen === q.answer
                ? `<div class="mt-4 text-sm font-semibold text-emerald-800 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3">✓ Correct!</div>`
                : `<div class="mt-4 text-sm font-semibold text-rose-800 bg-rose-500/10 border border-rose-500/30 rounded-xl p-3">✗ Not quite. The correct answer is ${String.fromCharCode(65 + q.answer)}.</div>`);
            return `
                <div class="flex-1 bg-[#faf8f2]">
                    <div class="max-w-3xl mx-auto p-4 sm:p-6">
                        <div class="flex items-center justify-between gap-3 mb-3">
                            <span class="bg-amber-400/10 text-amber-800 text-[11px] font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-amber-400/20 truncate">Practice · ${esc(subjLabel(q.subject))}</span>
                            <div class="flex items-center gap-3 shrink-0">
                                <div class="bg-white px-3 py-1.5 rounded-xl border border-[#e8e2d2] flex items-center gap-1.5">
                                    <span class="text-[10px] text-[#58796b] font-semibold uppercase">Time</span>
                                    <span id="practice-timer" class="font-mono text-emerald-700 font-bold text-sm">${formatClock(P.timeLeft)}</span>
                                </div>
                                <button onclick="quitPractice()" class="text-xs text-[#58796b] hover:text-[#0b3d2b] font-semibold">✕ Leave</button>
                            </div>
                        </div>
                        <div class="h-1.5 bg-[#eef1ec] rounded-full mb-4"><div class="h-1.5 bg-amber-400 rounded-full transition-all" style="width:${pct}%"></div></div>
                        <div class="bg-white border border-[#e8e2d2] rounded-2xl p-6 shadow-xl">
                            <div class="flex items-center justify-between mb-5 text-xs">
                                <span class="font-semibold text-[#58796b] uppercase">Question ${P.index + 1} of ${total}</span>
                                <span class="font-semibold text-emerald-700">Score: ${practiceScore()} / ${answered}</span>
                            </div>
                            ${q.passage ? `<div class="mb-5 p-4 rounded-xl bg-[#faf8f2] border border-[#e8e2d2] text-sm text-[#2f5546] leading-relaxed max-h-64 overflow-y-auto"><p class="text-xs font-semibold text-[#0b5a3c] uppercase mb-2">Read the passage and answer the question</p>${esc(q.passage)}</div>` : ''}
                            <h3 class="text-lg sm:text-xl font-medium text-[#0b3d2b] mb-5 leading-relaxed">${esc(q.question)}</h3>
                            <div class="space-y-3">${opts}</div>
                            ${feedback}
                            <div class="flex justify-end mt-6 pt-5 border-t border-[#e8e2d2]">
                                <button onclick="practiceNext()" class="px-6 py-3 rounded-xl font-semibold text-sm transition ${done ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20' : 'bg-[#eef1ec] hover:bg-[#e1e7e0] text-[#2f5546]'}">${isLast ? 'Finish' : (done ? 'Next →' : 'Skip →')}</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function startPracticeReview() {
            state.review = { items: buildPracticeReviewItems(), tab: 'all', back: 'practiceResult' };
            setView('review');
            window.scrollTo(0, 0);
        }

        function renderPracticeResult() {
            const P = state.practice;
            const right = practiceScore();
            const total = P.items.length;
            const pct = Math.round((right / total) * 100);
            const bd = practiceBreakdown();
            const msg = P.timedOut ? 'Time ran out. Unanswered questions count as wrong. ⏱️' : (pct >= 70 ? 'Great work! Keep it up. 🌟' : (pct >= 50 ? 'Good effort. Review the ones you missed. 👍' : 'Keep practising. Review your answers to learn from them. 📚'));
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#faf8f2]">

                        <p class="text-6xl font-extrabold text-emerald-700 mt-5">${right}<span class="text-2xl text-[#7a9588]"> / ${total}</span></p>

                        <div class="grid grid-cols-2 gap-2 mt-6 text-left">
                            ${Object.entries(bd).map(([sub, d]) => `
                                <div class="bg-[#faf8f2] p-3 rounded-lg border border-[#e8e2d2] flex justify-between items-center">

                            <button onclick="startPractice()" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-semibold py-3 rounded-xl transition">Practise again</button>
                            <button onclick="showDashboard()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">Dashboard</button>
                        </div>
                    </div>
                </div>`;

        // --- ADMIN (access controlled by the admins/{uid} document + Firestore rules) ---

        }

        function fmtTime(ts) { return ts && ts.toDate ? ts.toDate().toLocaleString() : '—'; }

        function renderAdmin() {
            const { users, sessions } = state.adminData;
            const card = 'bg-white border border-[#e8e2d2] rounded-2xl';
            const badge = x => x.status === 'Completed'
                ? 'bg-[#e1f3e8] text-[#0b5a3c] border border-[#bfe0cd]'
                : (x.mode === 'practice' ? 'bg-[#f6ecc9] text-[#8a6500] border border-[#ecdca4]' : 'bg-[#eef1ec] text-[#58796b] border border-[#e8e2d2]');
            return `
                <div class="flex-1 flex flex-col bg-[#faf8f2] text-[#0b3d2b]">
                    <header class="sticky top-0 z-20 bg-white border-b border-[#e8e2d2]">
                        <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg bg-[#066c43] text-white flex items-center justify-center text-sm">🎓</div>

                    </header>

                    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6">
                        <span class="text-[10px] font-semibold tracking-wider text-[#8a6500] bg-[#f6ecc9] rounded-full px-3 py-1">ADMIN PORTAL</span>
                        <h1 class="font-display font-extrabold text-2xl sm:text-3xl mt-3">Candidate activity & accounts</h1>

                        <div class="${card} p-5 mt-6">
                            <h2 class="font-display font-bold text-lg mb-4">Registered students (${users.length})</h2>
                            ${users.length === 0 ? '<p class="text-sm text-[#0b3d2b]/60">No students yet.</p>' : `

                                    ${users.map(u => `
                                        <div class="bg-[#faf8f2] p-4 rounded-xl border border-[#e8e2d2]">
